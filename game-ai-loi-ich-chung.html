<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tương tác: AI phục vụ lợi ích chung | Tin học Tiểu học</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --coral:#e15a45; --teal:#1b7f6e; --paper:#fff6ee; --ink:#2a211c; --muted:#7a655c; --line:#f0d8c8; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Be Vietnam Pro',system-ui,sans-serif; background:var(--paper); color:var(--ink); }
    .top { background:#fff; padding:12px 16px; display:flex; align-items:center; gap:12px; box-shadow:0 2px 10px rgba(0,0,0,.05); position:sticky; top:0; z-index:10; }
    .top a { color:var(--teal); font-weight:700; text-decoration:none; font-size:14px; }
    .top h1 { font-size:16px; font-weight:800; }
    .wrap { max-width:760px; margin:0 auto; padding:16px 14px 48px; }
    .hint { font-size:14px; color:var(--muted); margin-bottom:12px; }
    .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px; }
    @media(max-width:600px){ .grid { grid-template-columns:1fr; } }
    .pick { background:#fff; border:3px solid var(--line); border-radius:16px; overflow:hidden; cursor:pointer; text-align:left; font-family:inherit; }
    .pick.on { border-color:var(--coral); }
    .pick img { width:100%; height:100px; object-fit:cover; display:block; }
    .pick span { display:block; padding:10px; font-size:13px; font-weight:800; }
    .stage { background:#fff; border:2px solid var(--line); border-radius:20px; padding:14px; }
    .stage img { width:100%; height:180px; object-fit:cover; border-radius:12px; display:block; margin-bottom:12px; }
    .step { display:block; width:100%; text-align:left; margin-bottom:8px; padding:12px 14px; border-radius:12px; border:2px solid var(--line); background:var(--paper); font-weight:700; font-size:13px; font-family:inherit; cursor:pointer; }
    .step.done { background:#e5f5f1; border-color:var(--teal); color:var(--teal); }
    .step:disabled { opacity:.45; cursor:not-allowed; }
    .exp { margin-top:10px; background:var(--paper); border-radius:12px; padding:12px; font-size:14px; line-height:1.5; min-height:64px; }
  </style>
</head>
<body>
  <div class="top">
    <a href="lam-quen-voi-ai.html">← Trang AI</a>
    <h1>AI phục vụ lợi ích chung</h1>
  </div>
  <div class="wrap">
    <p class="hint">Chọn một tranh. Làm lần lượt từng bước. Mỗi bước có lời giải thích: AI chỉ gợi ý, con người quyết định.</p>
    <div class="grid" id="picks"></div>
    <div class="stage" id="stage">
      <p style="text-align:center;color:var(--muted);padding:28px 8px;font-weight:600">👆 Chọn một tình huống ở trên để bắt đầu</p>
    </div>
  </div>
  <script>
    const scenes = {
      bacsi: {
        title: 'Bác sĩ & bệnh nhân',
        img: 'images/bac-si.jpg',
        steps: [
          { a:'1. Bệnh nhân kể triệu chứng', e:'Bạn nhỏ nói: sốt và đau đầu hai ngày. Đây là dữ liệu do con người cung cấp. AI chưa quyết định gì.' },
          { a:'2. AI gợi ý', e:'Máy gợi ý: có thể là cảm thông thường. Đó chỉ là gợi ý từ dữ liệu, không phải kết luận. AI không thay bác sĩ.' },
          { a:'3. Bác sĩ quyết định', e:'Bác sĩ hỏi thêm, khám thêm rồi mới kê đơn. Quyết định và trách nhiệm thuộc về bác sĩ — con người.' }
        ]
      },
      rac: {
        title: 'Phân loại rác',
        img: 'images/rac.jpg',
        steps: [
          { a:'1. Camera nhìn rác', e:'AI nhìn chai nhựa và vỏ chuối qua hình ảnh. Nó nhận dạng dựa trên những ảnh đã được dạy trước đó.' },
          { a:'2. AI gợi ý thùng', e:'AI gợi ý: chai nhựa vào thùng tái chế, vỏ chuối vào thùng hữu cơ. Đây là gợi ý, có thể đúng hoặc sai.' },
          { a:'3. Người kiểm tra', e:'Bạn hoặc cô chú phụ trách nhìn lại rồi mới bỏ rác. Nếu AI nhầm, con người sửa. Con người chịu trách nhiệm.' }
        ]
      },
      xe: {
        title: 'Đường đi an toàn',
        img: 'images/giao-thong.jpg',
        steps: [
          { a:'1. AI thấy đường đông', e:'Dữ liệu camera và bản đồ cho thấy một đường đang ùn xe. AI chỉ đọc dữ liệu, chưa lái xe hộ ai.' },
          { a:'2. AI gợi ý đường khác', e:'AI gợi ý đường vắng hơn để đỡ chờ. Gợi ý có thể thay đổi khi đường thay đổi.' },
          { a:'3. Tài xế quyết định', e:'Người lái chọn đi hay không. Nếu mất bản đồ hoặc đường lạ, người lái phải tự xử lý. AI không thay người lái.' }
        ]
      }
    };
    let cur = null, step = 0;
    const picks = document.getElementById('picks');
    Object.keys(scenes).forEach(k => {
      const s = scenes[k];
      const b = document.createElement('button');
      b.className = 'pick';
      b.innerHTML = `<img src="${s.img}" alt=""><span>${s.title}</span>`;
      b.onclick = () => { cur = k; step = 0; render(); document.querySelectorAll('.pick').forEach(p => p.classList.toggle('on', p === b)); };
      picks.appendChild(b);
    });
    function render(){
      if (!cur) return;
      const s = scenes[cur];
      let html = `<img src="${s.img}" alt="${s.title}"><h3 style="margin-bottom:10px;font-size:16px">${s.title}</h3>`;
      s.steps.forEach((st,i) => {
        html += `<button class="step ${i<step?'done':''}" ${i>step?'disabled':''} onclick="doStep(${i})">${st.a}${i<step?' ✓':''}</button>`;
      });
      html += `<div class="exp">${step===0?'Bấm bước 1 để bắt đầu. AI chỉ gợi ý. Người trong tranh mới quyết định.':s.steps[step-1].e}</div>`;
      document.getElementById('stage').innerHTML = html;
    }
    function doStep(i){ if (i>step) return; step = i+1; render(); }
  </script>
</body>
</html>
