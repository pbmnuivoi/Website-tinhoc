<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bắt lỗi AI | Làm quen với AI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --blue:#0b5fff; --green:#00a86b; --red:#ef4444; --orange:#f59e0b; --purple:#7c3aed; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Be Vietnam Pro',system-ui,sans-serif; background:linear-gradient(160deg,#fef2f2,#fff7ed,#f0fdf4); min-height:100vh; color:#0f172a; }
    .topbar { background:#fff; box-shadow:0 2px 12px rgba(0,0,0,.06); padding:12px 20px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:50; }
    .topbar a { color:var(--blue); font-weight:700; text-decoration:none; display:inline-flex; align-items:center; gap:6px; font-size:14px; }
    .topbar h1 { font-size:17px; font-weight:800; color:var(--red); }
    .wrap { max-width:700px; margin:0 auto; padding:20px 16px 48px; }
    .hero { background:linear-gradient(135deg,#ef4444,#f59e0b); color:#fff; border-radius:20px; padding:22px; text-align:center; margin-bottom:18px; }
    .card { background:#fff; border-radius:18px; box-shadow:0 4px 24px rgba(0,0,0,.08); padding:22px; margin-bottom:16px; }
    .score-bar { display:flex; justify-content:space-between; font-weight:700; font-size:14px; background:#f8fafc; padding:12px 16px; border-radius:12px; margin-bottom:16px; }
    .ai-says {
      background:#0f172a; color:#e2e8f0; border-radius:14px; padding:18px; margin-bottom:16px;
      font-size:16px; font-weight:600; line-height:1.6; position:relative;
    }
    .ai-says::before { content:'🤖 AI nói:'; display:block; font-size:12px; color:#94a3b8; margin-bottom:8px; font-weight:700; }
    .opts { display:flex; flex-direction:column; gap:10px; }
    .opt {
      padding:14px 16px; border-radius:12px; border:2px solid #e2e8f0; background:#fff;
      font-weight:700; font-size:14px; cursor:pointer; transition:.2s; display:flex; align-items:center; gap:10px;
    }
    .opt:hover { border-color:var(--blue); background:#eef4ff; }
    .opt.correct { border-color:var(--green); background:#ecfdf5; color:#065f46; }
    .opt.wrong { border-color:var(--red); background:#fef2f2; color:#991b1b; }
    .opt.disabled { pointer-events:none; }
    .fb { margin-top:14px; padding:14px; border-radius:12px; font-size:13px; display:none; line-height:1.6; }
    .fb.show { display:block; }
    .fb.ok { background:#ecfdf5; color:#065f46; border:1px solid #a7f3d0; }
    .fb.err { background:#fef2f2; color:#991b1b; border:1px solid #fecaca; }
    .btn { display:inline-flex; align-items:center; gap:8px; padding:12px 22px; border-radius:999px; font-weight:700; font-size:14px; border:0; cursor:pointer; background:var(--blue); color:#fff; margin-top:12px; font-family:inherit; }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="lam-quen-voi-ai.html" id="backLink"><i class="fas fa-arrow-left"></i> Làm quen với AI</a>
    <h1><i class="fas fa-bug"></i> Bắt lỗi AI</h1>
    <span style="width:90px"></span>
  </div>
  <div class="wrap">
    <div class="hero">
      <h2>🕵️ AI cũng có thể sai!</h2>
      <p>Đọc câu AI nói → chọn Đúng / Sai / Cần kiểm tra. Hình thành thói quen không tin mù quáng.</p>
    </div>
    <div class="card">
      <div class="score-bar">
        <span>Câu <strong id="num">1</strong>/<span id="total">10</span></span>
        <span>Điểm: <strong id="score" style="color:var(--green)">0</strong></span>
      </div>
      <div class="ai-says" id="claim"></div>
      <div class="opts" id="opts">
        <div class="opt" data-a="dung"><i class="fas fa-check-circle" style="color:var(--green)"></i> Đúng</div>
        <div class="opt" data-a="sai"><i class="fas fa-times-circle" style="color:var(--red)"></i> Sai</div>
        <div class="opt" data-a="check"><i class="fas fa-search" style="color:var(--orange)"></i> Cần kiểm tra thêm</div>
      </div>
      <div class="fb" id="fb"></div>
      <div style="text-align:center">
        <button class="btn" id="next" style="display:none">Câu tiếp <i class="fas fa-arrow-right"></i></button>
        <button class="btn" id="restart" style="display:none;background:var(--purple)"><i class="fas fa-redo"></i> Chơi lại</button>
      </div>
    </div>
  </div>
  <script>
    const data = [
      { claim:'Mặt Trời quay quanh Trái Đất.', ans:'sai', explain:'Sai. Trái Đất quay quanh Mặt Trời. AI đôi khi nhầm kiến thức cơ bản.' },
      { claim:'Nước sôi ở khoảng 100°C khi ở mực nước biển.', ans:'dung', explain:'Đúng. Đây là kiến thức khoa học chuẩn. Vẫn nên đối chiếu sách khi học.' },
      { claim:'Con voi là động vật sống dưới nước như cá.', ans:'sai', explain:'Sai. Voi sống trên cạn. AI có thể bịa hoặc nhầm lẫn.' },
      { claim:'Việt Nam có thủ đô là Hà Nội.', ans:'dung', explain:'Đúng. Thông tin địa lý cơ bản này chính xác.' },
      { claim:'Có 8 hành tinh trong hệ Mặt Trời (theo cách phân loại phổ biến hiện nay).', ans:'dung', explain:'Đúng theo phân loại hiện tại (Pluto không còn là hành tinh chính thức từ 2006).' },
      { claim:'Người lớn nhất thế giới cao hơn 10 mét.', ans:'sai', explain:'Sai. Người cao nhất trong lịch sử chỉ khoảng 2,7 m. AI có thể phóng đại.' },
      { claim:'Uống nước rất quan trọng cho sức khỏe.', ans:'dung', explain:'Đúng. Đây là lời khuyên sức khỏe phổ biến và hợp lý.' },
      { claim:'Tất cả các loài khủng long đều biết bay.', ans:'sai', explain:'Sai. Chỉ một số loài (như pterosaur gần với bò sát bay) — không phải tất cả khủng long.' },
      { claim:'AI luôn đưa ra câu trả lời đúng 100%.', ans:'sai', explain:'Sai! AI có thể sai, bịa đặt (hallucination). Luôn cần kiểm chứng.' },
      { claim:'Số dân thế giới hiện nay khoảng vài tỷ người.', ans:'check', explain:'Cần kiểm tra thêm. “Vài tỷ” quá mơ hồ — nên tra số liệu cụ thể từ nguồn uy tín.' },
      { claim:'Trái Đất hình cầu (gần như hình cầu dẹt).', ans:'dung', explain:'Đúng. Trái Đất gần hình cầu, hơi dẹt ở hai cực.' },
      { claim:'Máy tính biết suy nghĩ và cảm xúc như con người.', ans:'sai', explain:'Sai. Máy tính/AI xử lý dữ liệu theo thuật toán, không có cảm xúc thật như người.' }
    ];
    let q=[], i=0, score=0, done=false;

    function shuffle(a){const b=[...a];for(let j=b.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[b[j],b[k]]=[b[k],b[j]];}return b;}

    function start(){
      q=shuffle(data).slice(0,10); i=0; score=0; done=false;
      document.getElementById('score').textContent='0';
      document.getElementById('total').textContent=q.length;
      document.getElementById('next').style.display='none';
      document.getElementById('restart').style.display='none';
      load();
    }

    function load(){
      done=false;
      document.getElementById('num').textContent=i+1;
      document.getElementById('claim').textContent=q[i].claim;
      document.getElementById('fb').className='fb';
      document.getElementById('next').style.display='none';
      document.querySelectorAll('.opt').forEach(o=>{
        o.className='opt';
        o.onclick=()=>answer(o);
      });
    }

    function answer(el){
      if(done) return;
      done=true;
      const d=q[i];
      const a=el.dataset.a;
      document.querySelectorAll('.opt').forEach(o=>o.classList.add('disabled'));
      const fb=document.getElementById('fb');
      if(a===d.ans){
        el.classList.add('correct');
        score+=10;
        document.getElementById('score').textContent=score;
        fb.className='fb show ok';
        fb.innerHTML='<i class="fas fa-check-circle"></i> '+d.explain;
      } else {
        el.classList.add('wrong');
        document.querySelectorAll('.opt').forEach(o=>{ if(o.dataset.a===d.ans) o.classList.add('correct'); });
        fb.className='fb show err';
        fb.innerHTML='<i class="fas fa-info-circle"></i> '+d.explain;
      }
      if(i<q.length-1) document.getElementById('next').style.display='inline-flex';
      else {
        document.getElementById('restart').style.display='inline-flex';
        fb.innerHTML+=`<br><br>🎉 Hoàn thành! Điểm: <strong>${score}</strong>/${q.length*10}`;
      }
    }

    document.getElementById('next').onclick=()=>{i++;load();};
    document.getElementById('restart').onclick=start;
    start();
  </script>

  <script>
    (function(){
      try {
        var g = localStorage.getItem('ai_grade') || '1';
        var a = document.getElementById('backLink');
        if (a) a.href = 'lam-quen-voi-ai.html#lop' + g;
      } catch(e) {}
    })();
  </script>
</body>
</html>
