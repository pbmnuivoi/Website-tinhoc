<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đúng / Sai: Cảm xúc AI</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--coral:#e15a45;--teal:#1b7f6e;--paper:#fff6ee;--ink:#2a211c;--muted:#7a655c;--line:#f0d8c8}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;background:var(--paper);color:var(--ink)}
.top{background:#fff;padding:12px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.top a{color:var(--teal);font-weight:700;text-decoration:none;font-size:14px}
.wrap{max-width:640px;margin:0 auto;padding:16px 14px 40px}
.hero img{width:100%;max-height:200px;object-fit:cover;border-radius:16px;border:2px solid var(--line)}
.q{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.q p{font-weight:700;font-size:15px;margin-bottom:10px}
.btns{display:flex;gap:8px}
.btns button{flex:1;border:2px solid var(--line);border-radius:12px;padding:12px;font-weight:800;font-family:inherit;background:var(--paper);cursor:pointer;font-size:14px}
.btns button.ok{background:#e5f5f1;border-color:var(--teal);color:var(--teal)}
.btns button.bad{background:#fde8e4;border-color:var(--coral);color:var(--coral)}
.exp{margin-top:8px;font-size:13px;line-height:1.45;color:var(--muted);min-height:36px}
</style>
</head>
<body>
<div class="top"><a href="lam-quen-voi-ai.html">← Trang AI</a><strong>Đúng / Sai – Cảm xúc AI</strong></div>
<div class="wrap">
  <img class="hero" src="cam-xuc.jpg" alt="Cảm xúc thật và robot" style="width:100%;max-height:200px;object-fit:cover;border-radius:16px">
  <p style="margin:10px 0;font-size:14px;color:var(--muted)">Đọc tranh rồi chọn Đúng hoặc Sai cho mỗi câu.</p>
  <div id="list"></div>
</div>
<script>
const qs=[
  {q:'Robot vui vì đang chơi thật giống bạn học sinh.', a:false, e:'Sai. Robot chỉ đổi mặt theo lệnh. Cảm xúc vui thật là của bạn.'},
  {q:'Cảm xúc của AI do con người lập trình sẵn.', a:true, e:'Đúng. Người viết chương trình: lệnh vui thì hiện mặt cười.'},
  {q:'AI tự buồn khi mất đồ chơi, không cần lệnh.', a:false, e:'Sai. AI không tự cảm thấy buồn. Phải có lệnh hoặc chương trình mới đổi mặt.'}
];
const list=document.getElementById('list');
qs.forEach((item,i)=>{
  const d=document.createElement('div');d.className='q';
  d.innerHTML=`<p>Câu ${i+1}. ${item.q}</p>
  <div class="btns">
    <button type="button" data-v="1">Đúng</button>
    <button type="button" data-v="0">Sai</button>
  </div>
  <div class="exp" id="e${i}"></div>`;
  d.querySelectorAll('button').forEach(b=>{
    b.onclick=()=>{
      const chose=b.dataset.v==='1';
      const right=chose===item.a;
      d.querySelectorAll('button').forEach(x=>{
        x.className='';
        if((x.dataset.v==='1')===item.a) x.classList.add('ok');
        else if(x===b && !right) x.classList.add('bad');
      });
      document.getElementById('e'+i).textContent=(right?'✓ ':'→ ')+item.e;
    };
  });
  list.appendChild(d);
});
</script>
</body>
</html>
