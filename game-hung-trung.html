<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hứng trứng | Tin học Tiểu học</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Nunito',sans-serif;min-height:100vh;color:#263238;background:linear-gradient(160deg,#fff8e1,#ffe0b2,#ffecb3)}
    .topbar{background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.06);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
    .topbar a{color:#ef6c00;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
    .topbar h1{font-size:18px;font-weight:800;color:#ef6c00}
    .wrap{max-width:640px;margin:0 auto;padding:16px 12px 48px}
    .hud{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;justify-content:center}
    .hud-item{background:#fff;border-radius:12px;padding:8px 14px;box-shadow:0 4px 15px rgba(0,0,0,.08);font-weight:800;font-size:13px}
    .game-card{background:#fff;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.1);padding:16px;text-align:center}
    .btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:999px;font-weight:800;font-size:14px;border:none;cursor:pointer;font-family:inherit;background:linear-gradient(135deg,#ef6c00,#ffb74d);color:#fff}
    .btn-outline{background:#fff;border:2px solid #ef6c00;color:#ef6c00;text-decoration:none}
    .screen{display:none;text-align:center;padding:20px 8px}
    .screen.show{display:block!important}
    #arena{position:relative;width:100%;max-width:520px;height:380px;margin:0 auto;border-radius:16px;overflow:hidden;border:4px solid #ff9800;background:linear-gradient(180deg,#87ceeb 0%,#e0f7fa 60%,#c8e6c9 100%);cursor:none}
    @media(max-width:480px){#arena{height:300px}}
    .egg{position:absolute;font-size:28px;line-height:1;pointer-events:none;transform:translate(-50%,-50%)}
    #basket{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:42px;line-height:1;pointer-events:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
    .hidden{display:none!important}
    .confetti{position:fixed;inset:0;pointer-events:none;z-index:100;overflow:hidden}
    .confetti span{position:absolute;width:10px;height:10px;border-radius:2px;animation:fall 2s ease-out forwards}
    @keyframes fall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
    .stars{font-size:28px;color:#ffc107;letter-spacing:2px;margin:8px 0}
  </style>
</head>
<body>
  <div class="topbar">
    <a href="hoc-ma-choi.html"><i class="fas fa-arrow-left"></i> Quay lại</a>
    <h1><i class="fas fa-egg"></i> Hứng trứng</h1>
    <span style="width:80px"></span>
  </div>
  <div class="wrap">
    <div class="screen show" id="startScreen">
      <div class="game-card">
        <h2 style="font-size:22px;font-weight:800;color:#ef6c00;margin-bottom:8px">🥚 Hứng trứng</h2>
        <p style="color:#546e7a;margin-bottom:14px;font-size:14px;line-height:1.5">
          Di chuyển <strong>chuột</strong> để hứng <strong>trứng 🥚</strong> và <strong>sao ⭐</strong>.<br>
          Hứng <strong>bom 💣</strong> hoặc rớt trứng = <strong>trừ điểm</strong>. Hết mạng = thua.<br>
          <strong>10 cửa</strong> · tốc độ tăng dần!
        </p>
        <button class="btn" id="btnStart"><i class="fas fa-play"></i> Bắt đầu cửa 1</button>
      </div>
    </div>
    <div id="playScreen" class="hidden">
      <div class="hud">
        <div class="hud-item">🚪 Cửa <span id="level">1</span>/10</div>
        <div class="hud-item">⭐ <span id="score">0</span></div>
        <div class="hud-item">❤️ <span id="lives">3</span></div>
        <div class="hud-item">🥚 <span id="caught">0</span>/<span id="need">10</span></div>
      </div>
      <div class="game-card" style="padding:12px">
        <div id="arena">
          <div id="basket">🧺</div>
        </div>
        <p style="margin-top:8px;font-size:12px;color:#888">🥚⭐ = điểm · 💣 = trừ điểm</p>
      </div>
    </div>
    <div class="screen hidden" id="endScreen">
      <div class="game-card">
        <div class="stars" id="endStars">★★☆☆☆</div>
        <h2 style="font-size:22px;font-weight:800;color:#ef6c00" id="endTitle">Thua rồi!</h2>
        <p style="color:#546e7a;margin:8px 0" id="endMsg"></p>
        <p style="font-weight:800;font-size:18px;color:#ef6c00">Điểm: <span id="finalScore">0</span></p>
        <button class="btn" id="btnReplay" style="margin-top:12px"><i class="fas fa-redo"></i> Chơi lại</button>
        <a href="hoc-ma-choi.html" class="btn btn-outline" style="margin-top:8px;display:inline-flex"><i class="fas fa-home"></i> Về Học mà chơi</a>
      </div>
    </div>
  </div>
  <div class="confetti" id="confetti"></div>
  <script>
  const LEVELS = [
    {need:8, speed:1.2, spawn:900, lives:3},
    {need:10, speed:1.4, spawn:800, lives:3},
    {need:12, speed:1.6, spawn:700, lives:3},
    {need:14, speed:1.9, spawn:650, lives:3},
    {need:15, speed:2.2, spawn:600, lives:3},
    {need:16, speed:2.5, spawn:550, lives:2},
    {need:18, speed:2.8, spawn:500, lives:2},
    {need:20, speed:3.2, spawn:450, lives:2},
    {need:22, speed:3.6, spawn:400, lives:2},
    {need:25, speed:4.0, spawn:350, lives:2}
  ];
  let level=0, score=0, lives=3, caught=0, eggs=[], bx=0, running=false, spawnId=null, raf=null, advancing=false;
  const arena=document.getElementById('arena');
  const basket=document.getElementById('basket');
  const $=id=>document.getElementById(id);

  function start(){
    level=0; score=0; advancing=false;
    $('startScreen').classList.remove('show');$('startScreen').style.display='none';
    $('endScreen').classList.add('hidden');
    $('endScreen').classList.remove('show');
    $('endScreen').style.display='';
    $('playScreen').classList.remove('hidden');
    loadLevel();
  }
  function loadLevel(){
    advancing=false;
    const L=LEVELS[level];
    lives=L.lives; caught=0; eggs=[]; running=true;
    $('level').textContent=level+1;
    $('score').textContent=score;
    $('lives').textContent=lives;
    $('caught').textContent=0;
    $('need').textContent=L.need;
    arena.querySelectorAll('.egg').forEach(e=>e.remove());
    bx=arena.clientWidth/2;
    basket.style.left=bx+'px';
    clearTimeout(spawnId); cancelAnimationFrame(raf);
    spawnLoop();
    raf=requestAnimationFrame(tick);
  }
  function spawnLoop(){
    if(!running||advancing)return;
    spawnEgg();
    const L=LEVELS[level];
    spawnId=setTimeout(spawnLoop, L.spawn + Math.random()*200);
  }
  function spawnEgg(){
    if(!running||advancing)return;
    const r=Math.random();
    let emoji, kind; // good | special | bad
    if(r<0.18){ emoji='💣'; kind='bad'; }
    else if(r<0.30){ emoji='⭐'; kind='special'; }
    else { emoji='🥚'; kind='good'; }
    const el=document.createElement('div');
    el.className='egg';
    el.textContent=emoji;
    const x=30+Math.random()*(arena.clientWidth-60);
    el.style.left=x+'px'; el.style.top='-20px';
    arena.appendChild(el);
    const L=LEVELS[level];
    eggs.push({el,x,y:-20, vy:L.speed*(0.8+Math.random()*0.5), kind});
  }
  function tick(){
    if(!running||advancing)return;
    const L=LEVELS[level];
    const bh=arena.clientHeight-50;
    for(const e of eggs){
      if(e.dead)continue;
      e.y+=e.vy;
      e.el.style.top=e.y+'px';
      if(e.y>=bh-10 && e.y<=bh+30){
        if(Math.abs(e.x-bx)<48){
          e.dead=true; e.el.remove();
          if(e.kind==='good'){
            score+=10; caught++;
          } else if(e.kind==='special'){
            score+=20; caught++;
          } else {
            // bad - hứng sai
            score=Math.max(0,score-15);
            lives--;
            $('lives').textContent=lives;
            if(lives<=0){lose();return;}
          }
          $('score').textContent=score;
          $('caught').textContent=caught;
          if(caught>=L.need){
            advancing=true;
            clearTimeout(spawnId);
            showConfetti();
            if(level>=9){win();return;}
            level++;
            setTimeout(loadLevel,700);
            return;
          }
          continue;
        }
      }
      if(e.y>arena.clientHeight+20){
        e.dead=true; e.el.remove();
        // rớt trứng tốt = trừ
        if(e.kind==='good'||e.kind==='special'){
          lives--; score=Math.max(0,score-5);
          $('lives').textContent=lives;
          $('score').textContent=score;
          if(lives<=0){lose();return;}
        }
        // bom rớt không sao
      }
    }
    eggs=eggs.filter(e=>!e.dead);
    raf=requestAnimationFrame(tick);
  }
  function lose(){
    running=false; clearTimeout(spawnId); cancelAnimationFrame(raf);
    $('endStars').textContent='★★☆☆☆';
    $('endTitle').textContent='Thua rồi!';
    $('endMsg').textContent='Hết mạng. Hãy chơi lại!';
    $('finalScore').textContent=score;
    $('playScreen').classList.add('hidden');
    $('endScreen').classList.remove('hidden');
    $('endScreen').classList.add('show');
    $('endScreen').style.display='block';
  }
  function win(){
    running=false; clearTimeout(spawnId); cancelAnimationFrame(raf);
    $('endStars').textContent='★★★★★';
    $('endTitle').textContent='Thắng rồi!';
    $('endMsg').textContent='Vượt 10 cửa – Vua hứng trứng!';
    $('finalScore').textContent=score;
    $('playScreen').classList.add('hidden');
    $('endScreen').classList.remove('hidden');
    $('endScreen').classList.add('show');
    $('endScreen').style.display='block';
    showConfetti();
  }
  arena.addEventListener('mousemove',e=>{
    const rect=arena.getBoundingClientRect();
    bx=Math.max(30,Math.min(rect.width-30,e.clientX-rect.left));
    basket.style.left=bx+'px';
  });
  arena.addEventListener('touchmove',e=>{
    e.preventDefault();
    const t=e.touches[0]; const rect=arena.getBoundingClientRect();
    bx=Math.max(30,Math.min(rect.width-30,t.clientX-rect.left));
    basket.style.left=bx+'px';
  },{passive:false});
  function showConfetti(){
    const box=$('confetti'); box.innerHTML='';
    const colors=['#ff9800','#fbbf24','#ef5350','#66bb6a','#42a5f5'];
    for(let i=0;i<50;i++){const s=document.createElement('span');s.style.left=Math.random()*100+'%';s.style.background=colors[i%5];s.style.animationDelay=Math.random()*.5+'s';box.appendChild(s);}
    setTimeout(()=>box.innerHTML='',2200);
  }
  $('btnStart').onclick=start;
  $('btnReplay').onclick=()=>{$('endScreen').classList.add('hidden');$('endScreen').classList.remove('show');$('endScreen').style.display='';start();};
  </script>
</body>
</html>
