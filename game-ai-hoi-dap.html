<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Hỏi – Đáp | Làm quen với AI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --blue:#0b5fff; --green:#00a86b; --red:#ef4444; --orange:#f59e0b; --purple:#7c3aed; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Be Vietnam Pro',system-ui,sans-serif; background:linear-gradient(160deg,#e0e7ff,#f0fdf4,#fef3c7); min-height:100vh; color:#0f172a; }
    .topbar { background:#fff; box-shadow:0 2px 12px rgba(0,0,0,.06); padding:12px 20px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:50; }
    .topbar a { color:var(--blue); font-weight:700; text-decoration:none; display:inline-flex; align-items:center; gap:6px; font-size:14px; }
    .topbar h1 { font-size:17px; font-weight:800; color:var(--blue); }
    .wrap { max-width:720px; margin:0 auto; padding:20px 16px 48px; }
    .hero { background:linear-gradient(135deg,#0b5fff,#06b6d4); color:#fff; border-radius:20px; padding:22px; text-align:center; margin-bottom:18px; }
    .card { background:#fff; border-radius:18px; box-shadow:0 4px 24px rgba(0,0,0,.08); padding:22px; margin-bottom:16px; }
    .step-label { font-weight:800; font-size:14px; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
    .step-label .n { width:26px; height:26px; border-radius:50%; background:var(--blue); color:#fff; display:grid; place-items:center; font-size:13px; }
    .q-list { display:flex; flex-direction:column; gap:8px; margin-bottom:8px; }
    .q-item {
      padding:14px 16px; border-radius:12px; border:2px solid #e2e8f0; background:#f8fafc;
      font-weight:600; font-size:14px; cursor:pointer; transition:.2s; text-align:left;
    }
    .q-item:hover { border-color:var(--blue); background:#eef4ff; }
    .q-item.sel { border-color:var(--blue); background:#dbeafe; color:#1e40af; }
    .ai-box {
      background:#0f172a; color:#e2e8f0; border-radius:14px; padding:18px; margin:16px 0;
      display:none;
    }
    .ai-box.show { display:block; }
    .ai-box .tag { font-size:11px; color:#94a3b8; font-weight:700; margin-bottom:10px; }
    .suggest {
      padding:12px 14px; border-radius:10px; background:#1e293b; margin-bottom:8px;
      border:2px solid #334155; cursor:pointer; transition:.2s; font-size:14px;
    }
    .suggest:hover { border-color:#60a5fa; }
    .suggest.picked { border-color:#60a5fa; background:#1e3a5f; }
    .suggest .badge { font-size:11px; opacity:.7; margin-left:6px; }
    .verify-bar {
      display:none; margin-top:14px; padding:16px; background:#f8fafc; border-radius:12px; border:1px solid #e2e8f0;
    }
    .verify-bar.show { display:block; }
    .verify-bar p { font-weight:700; font-size:14px; margin-bottom:10px; }
    .v-btns { display:flex; gap:10px; flex-wrap:wrap; }
    .v-btn {
      flex:1; min-width:120px; padding:12px; border-radius:12px; border:2px solid #e2e8f0;
      background:#fff; font-weight:800; font-size:14px; cursor:pointer; font-family:inherit; transition:.2s;
    }
    .v-btn.ok:hover, .v-btn.ok.active { border-color:var(--green); background:#ecfdf5; color:#065f46; }
    .v-btn.bad:hover, .v-btn.bad.active { border-color:var(--red); background:#fef2f2; color:#991b1b; }
    .v-btn.unsure:hover, .v-btn.unsure.active { border-color:var(--orange); background:#fffbeb; color:#92400e; }
    .result { margin-top:12px; padding:12px; border-radius:10px; font-size:13px; font-weight:600; display:none; }
    .result.show { display:block; }
    .result.good { background:#ecfdf5; color:#065f46; }
    .result.bad { background:#fef2f2; color:#991b1b; }
    .result.info { background:#fffbeb; color:#92400e; }
    .btn { display:inline-flex; align-items:center; gap:8px; padding:12px 22px; border-radius:999px; font-weight:700; font-size:14px; border:0; cursor:pointer; background:var(--blue); color:#fff; margin-top:12px; font-family:inherit; }
    .score-bar { display:flex; justify-content:space-between; font-weight:700; font-size:14px; background:#f8fafc; padding:10px 14px; border-radius:10px; margin-bottom:14px; }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="lam-quen-voi-ai.html" id="backLink"><i class="fas fa-arrow-left"></i> Làm quen với AI</a>
    <h1><i class="fas fa-comments"></i> AI Hỏi – Đáp</h1>
    <span style="width:90px"></span>
  </div>
  <div class="wrap">
    <div class="hero">
      <h2>💬 Em hỏi – AI gợi ý – Em kiểm tra</h2>
      <p>Chọn câu hỏi → AI đưa 2–3 gợi ý gần đúng → Em xác nhận câu nào đúng.</p>
    </div>
    <div class="card">
      <div class="score-bar">
        <span>Đã kiểm tra: <strong id="doneCount">0</strong></span>
        <span>Đúng: <strong id="okCount" style="color:var(--green)">0</strong></span>
      </div>

      <div class="step-label"><span class="n">1</span> Chọn câu hỏi của em</div>
      <div class="q-list" id="qList"></div>

      <div class="ai-box" id="aiBox">
        <div class="tag">🤖 AI gợi ý các nội dung gần đúng:</div>
        <div id="suggests"></div>
      </div>

      <div class="verify-bar" id="verifyBar">
        <p id="verifyQ">Gợi ý em chọn có đúng không?</p>
        <div class="v-btns">
          <button class="v-btn ok" data-v="ok"><i class="fas fa-check"></i> Đúng</button>
          <button class="v-btn bad" data-v="bad"><i class="fas fa-times"></i> Sai</button>
          <button class="v-btn unsure" data-v="unsure"><i class="fas fa-question"></i> Chưa chắc</button>
        </div>
        <div class="result" id="result"></div>
      </div>

      <div style="text-align:center">
        <button class="btn" id="nextQ" style="display:none"><i class="fas fa-arrow-right"></i> Câu hỏi khác</button>
      </div>
    </div>
  </div>
  <script>
    /*
      Flow:
      1. Student picks a question
      2. AI shows 2-3 suggestions (1 correct-ish, others flawed or partial)
      3. Student picks one suggestion
      4. Student verifies: Đúng / Sai / Chưa chắc
      5. System shows explanation
    */
    const bank = [
      {
        q: 'Vì sao bầu trời màu xanh?',
        suggestions: [
          { text: 'Ánh sáng Mặt Trời bị không khí tán xạ, màu xanh tán xạ mạnh hơn.', correct: true, note: 'Đúng hướng! Đây là hiện tượng tán xạ Rayleigh.' },
          { text: 'Vì biển phản chiếu màu xanh lên trời.', correct: false, note: 'Sai. Biển không làm bầu trời xanh; nguyên nhân là tán xạ ánh sáng.' },
          { text: 'Trời vốn dĩ có sơn màu xanh.', correct: false, note: 'Sai hoàn toàn. Bầu trời không bị “sơn”.' }
        ]
      },
      {
        q: 'AI là gì?',
        suggestions: [
          { text: 'Máy tính được lập trình để học và làm một số việc giống suy nghĩ của người.', correct: true, note: 'Đúng! AI là trí tuệ nhân tạo – máy học từ dữ liệu để hỗ trợ con người.' },
          { text: 'Một người máy biết cảm xúc như người thật.', correct: false, note: 'Chưa đúng. AI chưa có cảm xúc thật như con người.' },
          { text: 'Chỉ là ứng dụng chat trên điện thoại.', correct: false, note: 'Quá hẹp. Chatbot chỉ là một ứng dụng của AI.' }
        ]
      },
      {
        q: 'Con người cần nước vì lý do gì?',
        suggestions: [
          { text: 'Nước giúp cơ thể hoạt động, vận chuyển chất dinh dưỡng và điều hòa nhiệt độ.', correct: true, note: 'Đúng! Nước rất quan trọng cho sự sống.' },
          { text: 'Chỉ để làm đẹp da.', correct: false, note: 'Không đủ. Nước còn quan trọng hơn nhiều so với chỉ làm đẹp.' },
          { text: 'Vì nước có màu trong suốt nên phải uống.', correct: false, note: 'Sai logic. Màu không phải lý do cần uống nước.' }
        ]
      },
      {
        q: 'Trái Đất quay quanh cái gì?',
        suggestions: [
          { text: 'Quay quanh Mặt Trời.', correct: true, note: 'Đúng! Trái Đất vừa tự quay vừa quay quanh Mặt Trời.' },
          { text: 'Quay quanh Mặt Trăng.', correct: false, note: 'Sai. Mặt Trăng quay quanh Trái Đất.' },
          { text: 'Đứng yên, không quay.', correct: false, note: 'Sai. Trái Đất luôn chuyển động.' }
        ]
      },
      {
        q: 'Làm sao để dùng AI an toàn?',
        suggestions: [
          { text: 'Không chia sẻ thông tin cá nhân (địa chỉ, mật khẩu, số điện thoại) và luôn kiểm tra thông tin AI đưa.', correct: true, note: 'Đúng! An toàn + kiểm chứng là hai nguyên tắc quan trọng.' },
          { text: 'Tin mọi thứ AI nói vì AI không bao giờ sai.', correct: false, note: 'Sai nguy hiểm! AI có thể sai hoặc bịa thông tin.' },
          { text: 'Chỉ cần không dùng AI là an toàn.', correct: false, note: 'Không thực tế. Quan trọng là dùng đúng cách, có trách nhiệm.' }
        ]
      },
      {
        q: 'Cây xanh giúp gì cho môi trường?',
        suggestions: [
          { text: 'Hút khí carbon dioxide và nhả oxygen, làm không khí trong lành hơn.', correct: true, note: 'Đúng! Cây quang hợp rất có lợi cho môi trường.' },
          { text: 'Chỉ để trang trí cho đẹp.', correct: false, note: 'Thiếu sót. Cây còn có vai trò sinh thái rất lớn.' },
          { text: 'Cây làm tăng khí độc trong không khí.', correct: false, note: 'Sai. Cây giúp lọc và cải thiện không khí.' }
        ]
      },
      {
        q: 'Prompt (câu lệnh cho AI) tốt nên có gì?',
        suggestions: [
          { text: 'Rõ ràng: nói AI là ai, cần làm gì, nội dung gì, trả lời thế nào.', correct: true, note: 'Đúng! Prompt có cấu trúc giúp AI trả lời đúng ý hơn.' },
          { text: 'Chỉ cần gõ một từ là đủ.', correct: false, note: 'Thường không đủ. Càng rõ ràng AI càng hỗ trợ tốt.' },
          { text: 'Viết càng dài, càng khó hiểu càng hay.', correct: false, note: 'Sai. Dài nhưng rối sẽ làm AI hiểu nhầm.' }
        ]
      },
      {
        q: 'Tại sao cần kiểm tra thông tin từ AI?',
        suggestions: [
          { text: 'Vì AI có thể sai, nhầm hoặc “bịa” thông tin trông có vẻ đúng.', correct: true, note: 'Đúng! Hiện tượng hallucination – luôn nên đối chiếu nguồn uy tín.' },
          { text: 'Vì AI luôn đúng nên chỉ cần đọc cho vui.', correct: false, note: 'Sai. AI không đảm bảo đúng 100%.' },
          { text: 'Không cần kiểm tra, mất thời gian.', correct: false, note: 'Thói quen nguy hiểm. Kiểm tra giúp em học chắc hơn.' }
        ]
      }
    ];

    let done = 0, okCount = 0;
    let current = null;
    let pickedSuggest = null;

    function shuffle(a){ const b=[...a]; for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; }

    function showQuestions() {
      const list = shuffle(bank);
      document.getElementById('qList').innerHTML = list.map((item, i) =>
        `<div class="q-item" data-i="${bank.indexOf(item)}">${item.q}</div>`
      ).join('');
      document.getElementById('qList').querySelectorAll('.q-item').forEach(el => {
        el.onclick = () => selectQ(+el.dataset.i, el);
      });
      document.getElementById('aiBox').classList.remove('show');
      document.getElementById('verifyBar').classList.remove('show');
      document.getElementById('result').className = 'result';
      document.getElementById('nextQ').style.display = 'none';
      pickedSuggest = null;
    }

    function selectQ(idx, el) {
      document.querySelectorAll('.q-item').forEach(x => x.classList.remove('sel'));
      el.classList.add('sel');
      current = bank[idx];
      const sugs = shuffle([...current.suggestions]);
      document.getElementById('suggests').innerHTML = sugs.map((s, i) =>
        `<div class="suggest" data-i="${current.suggestions.indexOf(s)}">
          <strong>Gợi ý ${i + 1}:</strong> ${s.text}
        </div>`
      ).join('');
      document.getElementById('aiBox').classList.add('show');
      document.getElementById('verifyBar').classList.remove('show');
      document.getElementById('result').className = 'result';
      document.getElementById('nextQ').style.display = 'none';

      document.querySelectorAll('.suggest').forEach(sg => {
        sg.onclick = () => {
          document.querySelectorAll('.suggest').forEach(x => x.classList.remove('picked'));
          sg.classList.add('picked');
          pickedSuggest = current.suggestions[+sg.dataset.i];
          document.getElementById('verifyBar').classList.add('show');
          document.getElementById('verifyQ').textContent = 'Gợi ý em chọn có đúng không? Hãy kiểm tra và xác nhận:';
          document.getElementById('result').className = 'result';
          document.querySelectorAll('.v-btn').forEach(b => b.classList.remove('active'));
        };
      });
    }

    document.querySelectorAll('.v-btn').forEach(btn => {
      btn.onclick = () => {
        if (!pickedSuggest) return;
        document.querySelectorAll('.v-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const v = btn.dataset.v;
        const res = document.getElementById('result');
        const isCorrect = pickedSuggest.correct;

        if (v === 'ok') {
          if (isCorrect) {
            res.className = 'result show good';
            res.innerHTML = `<i class="fas fa-check-circle"></i> Em xác nhận đúng! ${pickedSuggest.note}`;
            okCount++;
          } else {
            res.className = 'result show bad';
            res.innerHTML = `<i class="fas fa-times-circle"></i> Em bảo “Đúng” nhưng gợi ý này chưa đúng. ${pickedSuggest.note}`;
          }
        } else if (v === 'bad') {
          if (!isCorrect) {
            res.className = 'result show good';
            res.innerHTML = `<i class="fas fa-check-circle"></i> Em phát hiện đúng — gợi ý này sai! ${pickedSuggest.note}`;
            okCount++;
          } else {
            res.className = 'result show bad';
            res.innerHTML = `<i class="fas fa-info-circle"></i> Gợi ý này thực ra đúng. ${pickedSuggest.note}`;
          }
        } else {
          res.className = 'result show info';
          res.innerHTML = `<i class="fas fa-search"></i> Tốt khi còn nghi ngờ! Hãy đọc lại: ${pickedSuggest.note}`;
          if (isCorrect) okCount++; // partial credit for careful thinking
        }
        done++;
        document.getElementById('doneCount').textContent = done;
        document.getElementById('okCount').textContent = okCount;
        document.getElementById('nextQ').style.display = 'inline-flex';
      };
    });

    document.getElementById('nextQ').onclick = showQuestions;
    showQuestions();
  </script>

  <script>
    (function(){
      try {
        var g = localStorage.getItem('ai_grade') || '1';
        var a = document.getElementById('backLink');
        if (a) a.href = 'lam-quen-voi-ai.html#lop' + g;
      } catch(e) {}
    })();
  </script>
</body>
</html>
