<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tương tác: AI không thay thế con người | Tin học Tiểu học</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --coral:#e15a45; --teal:#1b7f6e; --paper:#fff6ee; --ink:#2a211c; --muted:#7a655c; --line:#f0d8c8; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Be Vietnam Pro',system-ui,sans-serif; background:var(--paper); color:var(--ink); }
    .top { background:#fff; padding:12px 16px; display:flex; align-items:center; gap:12px; box-shadow:0 2px 10px rgba(0,0,0,.05); position:sticky; top:0; }
    .top a { color:var(--teal); font-weight:700; text-decoration:none; font-size:14px; }
    .top h1 { font-size:16px; font-weight:800; }
    .wrap { max-width:720px; margin:0 auto; padding:16px 14px 48px; }
    .hint { font-size:14px; color:var(--muted); margin-bottom:12px; }
    .item { display:flex; gap:12px; align-items:center; width:100%; background:#fff; border:3px solid var(--line); border-radius:16px; padding:10px; margin-bottom:10px; cursor:pointer; font-family:inherit; text-align:left; }
    .item.on { border-color:var(--coral); }
    .item img { width:96px; height:72px; object-fit:cover; border-radius:10px; flex-shrink:0; }
    .item strong { font-size:14px; }
    .detail { background:#fff; border:2px solid var(--line); border-radius:18px; padding:14px; margin-top:8px; }
    .detail img { width:100%; height:200px; object-fit:cover; border-radius:12px; display:block; margin-bottom:12px; }
    .lim { background:#fde8e4; border-radius:12px; padding:12px; font-size:14px; margin-bottom:8px; line-height:1.45; }
    .hum { background:#e5f5f1; border-radius:12px; padding:12px; font-size:14px; line-height:1.45; }
  </style>
</head>
<body>
  <div class="top">
    <a href="lam-quen-voi-ai.html">← Trang AI</a>
    <h1>AI không thay thế con người</h1>
  </div>
  <div class="wrap">
    <p class="hint">Bấm từng tranh. Đọc giới hạn của máy và việc con người vẫn phải làm.</p>
    <div id="list"></div>
    <div class="detail" id="detail"></div>
  </div>
  <script>
    const items = [
      { img:'hut-bui.jpg', title:'Robot hút bụi', lim:'Robot nhỏ không nhặt được thùng carton to hơn nó.', hum:'Bạn phải tự nhấc đồ lớn. AI chỉ hút bụi nhỏ.' },
      { img:'xe-mat-ban-do.jpg', title:'Xe mất bản đồ', lim:'Khi mất kết nối bản đồ, xe không tự tìm đường nhanh nhất.', hum:'Người trên xe phải quan sát và quyết định hướng đi.' },
      { img:'cam-xuc.jpg', title:'Bạn vẫn phải học', lim:'Robot cười theo lệnh, nhưng không học bài hộ bạn.', hum:'Bạn ghi nhớ và làm bài. AI chỉ gợi ý, không thay việc học.' }
    ];
    let open = 0;
    const list = document.getElementById('list');
    items.forEach((it,i) => {
      const b = document.createElement('button');
      b.className = 'item' + (i===0?' on':'');
      b.innerHTML = `<img src="${it.img}" alt=""><strong>${it.title}</strong>`;
      b.onclick = () => { open = i; render(); document.querySelectorAll('.item').forEach((el,j)=>el.classList.toggle('on', j===i)); };
      list.appendChild(b);
    });
    function render(){
      const it = items[open];
      document.getElementById('detail').innerHTML = `
        <img src="${it.img}" alt="${it.title}">
        <div class="lim"><strong style="color:#c2412e">Giới hạn: </strong>${it.lim}</div>
        <div class="hum"><strong style="color:#1b7f6e">Con người: </strong>${it.hum}</div>`;
    }
    render();
  </script>
</body>
</html>
