<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Máy học | Làm quen với AI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --blue:#0b5fff; --green:#00a86b; --purple:#7c3aed; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Be Vietnam Pro',system-ui,sans-serif; background:linear-gradient(160deg,#e0e7ff,#ecfdf5,#fef3c7); min-height:100vh; color:#0f172a; }
    .topbar { background:#fff; box-shadow:0 2px 12px rgba(0,0,0,.06); padding:12px 20px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:50; }
    .topbar a { color:var(--blue); font-weight:700; text-decoration:none; display:inline-flex; align-items:center; gap:6px; font-size:14px; }
    .topbar h1 { font-size:16px; font-weight:800; color:var(--purple); }
    .wrap { max-width:860px; margin:0 auto; padding:20px 16px 48px; }
    .hero { background:linear-gradient(135deg,#7c3aed,#0b5fff); color:#fff; border-radius:20px; padding:20px; text-align:center; margin-bottom:16px; }
    .card { background:#fff; border-radius:18px; box-shadow:0 4px 24px rgba(0,0,0,.08); padding:18px; margin-bottom:14px; }
    .modes { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:14px; }
    .mode-btn { padding:10px 16px; border-radius:999px; border:2px solid #e2e8f0; background:#f8fafc; font-weight:700; font-size:13px; cursor:pointer; font-family:inherit; }
    .mode-btn.on { border-color:var(--purple); background:#ede9fe; color:#5b21b6; }
    .step { font-weight:800; font-size:14px; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
    .step b { width:26px; height:26px; border-radius:50%; background:var(--purple); color:#fff; display:grid; place-items:center; font-size:13px; }
    .samples { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
    .group { background:#f8fafc; border-radius:14px; padding:12px; text-align:center; border:2px solid #e2e8f0; }
    .group h4 { font-size:13px; margin-bottom:8px; }
    .thumbs { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; }
    .thumbs img, .thumbs canvas { width:72px; height:72px; object-fit:cover; border-radius:10px; border:2px solid #cbd5e1; background:#fff; }
    .btn { display:inline-flex; align-items:center; gap:8px; padding:12px 22px; border-radius:999px; font-weight:700; font-size:14px; border:0; cursor:pointer; font-family:inherit; margin:6px 4px; }
    .btn-purple { background:var(--purple); color:#fff; }
    .btn-blue { background:var(--blue); color:#fff; }
    .btn-green { background:var(--green); color:#fff; }
    .btn:disabled { opacity:.45; cursor:not-allowed; }
    .status { text-align:center; font-size:13px; color:#64748b; margin:8px 0; min-height:20px; }
    .video-wrap { position:relative; width:100%; max-width:420px; margin:0 auto; border-radius:16px; overflow:hidden; background:#0f172a; aspect-ratio:4/3; }
    video, #overlay { width:100%; height:100%; object-fit:cover; display:block; }
    #overlay { position:absolute; left:0; top:0; pointer-events:none; }
    .result-box { margin-top:14px; padding:16px; border-radius:14px; background:#f1f5f9; text-align:center; font-weight:800; font-size:16px; min-height:100px; }
    .pct-row { display:flex; flex-direction:column; gap:8px; margin-top:12px; text-align:left; max-width:320px; margin-left:auto; margin-right:auto; }
    .pct-item { display:grid; grid-template-columns:70px 1fr 44px; align-items:center; gap:8px; font-size:13px; font-weight:700; }
    .pct-bar { height:10px; background:#e2e8f0; border-radius:999px; overflow:hidden; }
    .pct-bar > div { height:100%; border-radius:999px; transition:width .35s; }
    .hint { font-size:12px; color:#64748b; font-weight:600; margin-top:8px; }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="lam-quen-voi-ai.html" id="backLink"><i class="fas fa-arrow-left"></i> Quay lại</a>
    <h1><i class="fas fa-brain"></i> AI Máy học</h1>
    <span style="width:80px"></span>
  </div>
  <div class="wrap">
    <div class="hero">
      <h2>🧠 AI học từ ảnh thật</h2>
      <p>Ảnh mẫu thật → AI học → Camera đoán và hiện % từng loại</p>
    </div>
    <div class="card">
      <div class="modes">
        <button class="mode-btn on" data-mode="do_dung">✏️ Đồ dùng</button>
        <button class="mode-btn" data-mode="con_vat">🐶 Con vật</button>
        <button class="mode-btn" data-mode="cay_canh">🌳 Cây cảnh</button>
      </div>
      <div class="step"><b>1</b> Ảnh thật để AI học — <span id="modeTitle">Đồ dùng</span></div>
      <div class="samples" id="samples"></div>
      <div style="text-align:center;margin-top:12px">
        <button class="btn btn-purple" id="btnTrain" disabled><i class="fas fa-graduation-cap"></i> Cho AI học nhóm này</button>
      </div>
      <p class="status" id="trainStatus">Đang tải ảnh thật…</p>
    </div>
    <div class="card">
      <div class="step"><b>2</b> Đưa đồ thật vào camera</div>
      <div class="video-wrap">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
      </div>
      <div style="text-align:center;margin-top:10px">
        <button class="btn btn-blue" id="btnCam" disabled><i class="fas fa-video"></i> Bật camera</button>
        <button class="btn btn-green" id="btnGuess" disabled><i class="fas fa-search"></i> AI đoán ngay</button>
      </div>
      <div class="result-box" id="result">
        <div>Chưa đoán</div>
        <div class="hint">Học xong → bật camera → đưa vật vào khung → xem % từng loại</div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/knn-classifier@1.2.4/dist/knn-classifier.min.js"></script>
  <script>
    // Ảnh thật (Unsplash) — nhiều ảnh / mỗi lớp để AI học tốt hơn
    const MODES = {
      do_dung: {
        title: 'Đồ dùng học tập',
        classes: [
          { name:'Bút', emoji:'✏️', color:'#ef4444', urls:[
            'https://images.unsplash.com/photo-1585336261022-680e295ce3fe?w=200&h=200&fit=crop',
            'https://images.unsplash.com/photo-1513542789411-b6a5d4f31634?w=200&h=200&fit=crop',
            'https://images.unsplash.com/photo-1569235186275-626cb53b83ce?w=200&h=200&fit=crop',
            'https://images.unsplash.com/photo-1583485088034-697b5bc36b3d?w=200&h=200&fit=crop'
          ]},
          { name:'Sách', emoji:'📚', color:'#3b82f6', urls:[
            'https://images.unsplash.com/photo-1544947950-fa07a98d237f?w=200&h=200&fit=crop',
            'https://images.unsplash.com/photo-1512820790803-83ca734da794?w=200&h=200&fit=crop',
            'https://images.unsplash.com/photo-1495446815901-a7297e633e8d?w=200&h=200&fit=crop',
            'https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?w=200&h=200&fit=crop'
          ]}
        ]
      },
      con_vat: {
        title: 'Con vật',
        classes: [
          { name:'Chó', emoji:'🐶', color:'#d97706', urls:[
            'https://images.unsplash.com/photo-1587300003388-59208cc962f0?w=200&h=200&fit=crop',
            'https://images.unsplash.com/photo-1552053831-71594a27632d?w=200&h=200&fit=crop',
            'https://images.unsplash.com/photo-1517849845537-4d257902454a?w=200&h=200&fit=crop',
            'https://images.unsplash.com/photo-1583511655857-d19b40a7a54e?w=200&h=200&fit=crop'
          ]},
          { name:'Mèo', emoji:'🐱', color:'#f97316', urls:[
            'https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=200&h=200&fit=crop',
            'https://images.unsplash.com/photo-1574158622682-e40e69881006?w=200&h=200&fit=crop',
            'https://images.unsplash.com/photo-1495360010541-f48722b34f7d?w=200&h=200&fit=crop',
            'https://images.unsplash.com/photo-1511044568932-b92f1e6f3c41?w=200&h=200&fit=crop'
          ]},
          { name:'Chim', emoji:'🐦', color:'#0ea5e9', urls:[
            'https://images.unsplash.com/photo-1444464666168-49d633b86797?w=200&h=200&fit=crop',
            'https://images.unsplash.com/photo-1552728089-57bdde30beb3?w=200&h=200&fit=crop',
            'https://images.unsplash.com/photo-1522926193341-e9ffd686c60f?w=200&h=200&fit=crop',
            'https://images.unsplash.com/photo-1471922694854-ff1b63b20054?w=200&h=200&fit=crop'
          ]}
        ]
      },
      cay_canh: {
        title: 'Cây cảnh',
        classes: [
          { name:'Cây', emoji:'🌳', color:'#16a34a', urls:[
            'https://images.unsplash.com/photo-1502082553048-f009c37129b9?w=200&h=200&fit=crop',
            'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=200&h=200&fit=crop',
            'https://images.unsplash.com/photo-1454418747937-bd95bb9450e5?w=200&h=200&fit=crop',
            'https://images.unsplash.com/photo-1513836279014-a89f7a76ae86?w=200&h=200&fit=crop'
          ]},
          { name:'Hoa', emoji:'🌸', color:'#ec4899', urls:[
            'https://images.unsplash.com/photo-1490750967868-88aa6483a31e?w=200&h=200&fit=crop',
            'https://images.unsplash.com/photo-1462275646964-a0e3c3e4e685?w=200&h=200&fit=crop',
            'https://images.unsplash.com/photo-1468327768560-75b778cbb551?w=200&h=200&fit=crop',
            'https://images.unsplash.com/photo-1455659817273-f96807726540?w=200&h=200&fit=crop'
          ]},
          { name:'Lá', emoji:'🍃', color:'#22c55e', urls:[
            'https://images.unsplash.com/photo-1446071103084-c427f3f9e5ba?w=200&h=200&fit=crop',
            'https://images.unsplash.com/photo-1509423350716-bf990ce50663?w=200&h=200&fit=crop',
            'https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?w=200&h=200&fit=crop',
            'https://images.unsplash.com/photo-1470058869958-2a77ade41c02?w=200&h=200&fit=crop'
          ]}
        ]
      }
    };

    let mode = 'do_dung';
    let imageEls = {}; // name -> [HTMLImageElement]
    let mobilenetModel = null, classifier = null, trained = false, stream = null;

    function loadImage(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error('fail '+url));
        img.src = url;
      });
    }

    async function buildSamples() {
      const box = document.getElementById('samples');
      box.innerHTML = '';
      imageEls = {};
      const m = MODES[mode];
      document.getElementById('modeTitle').textContent = m.title;
      document.getElementById('trainStatus').textContent = 'Đang tải ảnh thật…';
      document.getElementById('btnTrain').disabled = true;
      trained = false;
      document.getElementById('btnCam').disabled = true;
      document.getElementById('btnGuess').disabled = true;

      for (const cls of m.classes) {
        const g = document.createElement('div');
        g.className = 'group';
        g.innerHTML = '<h4>'+cls.emoji+' '+cls.name+'</h4><div class="thumbs"></div>';
        const thumbs = g.querySelector('.thumbs');
        imageEls[cls.name] = [];
        for (const url of cls.urls) {
          try {
            const img = await loadImage(url);
            img.title = cls.name;
            thumbs.appendChild(img);
            imageEls[cls.name].push(img);
          } catch (e) {
            // fallback colored canvas
            const c = document.createElement('canvas');
            c.width = 96; c.height = 96;
            const ctx = c.getContext('2d');
            ctx.fillStyle = cls.color;
            ctx.fillRect(0,0,96,96);
            ctx.fillStyle = '#fff';
            ctx.font = '28px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(cls.emoji, 48, 56);
            thumbs.appendChild(c);
            imageEls[cls.name].push(c);
          }
        }
        box.appendChild(g);
      }
      document.getElementById('trainStatus').textContent = 'Ảnh thật đã sẵn sàng. Bấm “Cho AI học nhóm này”.';
      document.getElementById('btnTrain').disabled = !mobilenetModel;
    }

    async function loadModels() {
      try {
        await tf.setBackend('webgl');
        await tf.ready();
        mobilenetModel = await mobilenet.load({ version: 2, alpha: 0.75 });
        classifier = knnClassifier.create();
        document.getElementById('trainStatus').textContent = 'Mô hình sẵn sàng. Bấm “Cho AI học nhóm này”.';
        document.getElementById('btnTrain').disabled = false;
      } catch (e) {
        document.getElementById('trainStatus').textContent = 'Không tải được mô hình. Kiểm tra mạng.';
      }
    }

    async function train() {
      if (!mobilenetModel || !classifier) return;
      document.getElementById('btnTrain').disabled = true;
      document.getElementById('trainStatus').textContent = 'AI đang học từ ảnh thật…';
      classifier.clearAllClasses();
      for (const name of Object.keys(imageEls)) {
        for (const img of imageEls[name]) {
          // mỗi ảnh học nhiều lần (augment nhẹ bằng crop)
          for (let k = 0; k < 6; k++) {
            const act = mobilenetModel.infer(img, true);
            classifier.addExample(act, name);
            act.dispose();
          }
        }
      }
      trained = true;
      const n = Object.keys(imageEls).length;
      document.getElementById('trainStatus').textContent = 'AI đã học '+n+' loại trong nhóm “'+MODES[mode].title+'”. Bật camera để đoán!';
      document.getElementById('btnCam').disabled = false;
      document.getElementById('btnTrain').disabled = false;
    }

    async function startCam() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        overlay.width = video.videoWidth || 640;
        overlay.height = video.videoHeight || 480;
        document.getElementById('btnGuess').disabled = false;
        document.getElementById('trainStatus').textContent = 'Đưa vật vào giữa khung rồi bấm “AI đoán ngay”.';
      } catch (e) {
        document.getElementById('trainStatus').textContent = 'Không mở được camera.';
      }
    }

    async function guess() {
      if (!trained || !stream) return;
      const result = document.getElementById('result');
      result.innerHTML = '<div>AI đang nhìn…</div>';
      try {
        const act = mobilenetModel.infer(video, true);
        const pred = await classifier.predictClass(act, 15);
        act.dispose();
        const conf = pred.confidences || {};
        const labels = Object.keys(conf).sort((a,b) => conf[b]-conf[a]);
        const top = labels[0];
        const topPct = Math.round((conf[top]||0)*100);
        const m = MODES[mode];
        const clsMap = {};
        m.classes.forEach(c => { clsMap[c.name] = c; });

        let rows = '';
        labels.forEach(lab => {
          const pct = Math.round((conf[lab]||0)*100);
          const c = clsMap[lab] || { emoji:'🔍', color:'#64748b' };
          rows += '<div class="pct-item"><span>'+c.emoji+' '+lab+'</span><div class="pct-bar"><div style="width:'+pct+'%;background:'+c.color+'"></div></div><span>'+pct+'%</span></div>';
        });

        result.innerHTML =
          '<div style="font-size:18px">AI đoán: <strong style="color:#7c3aed">'+(clsMap[top]?clsMap[top].emoji+' ':'')+top+'</strong> · <span style="color:#00a86b">'+topPct+'%</span></div>'+
          '<div class="pct-row">'+rows+'</div>'+
          '<div class="hint">Mỗi thanh là % khả năng thuộc loại đó</div>';

        const ctx = overlay.getContext('2d');
        ctx.clearRect(0,0,overlay.width,overlay.height);
        ctx.fillStyle = 'rgba(124,58,237,0.9)';
        ctx.fillRect(10,10,260,40);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 18px Be Vietnam Pro,sans-serif';
        ctx.fillText((clsMap[top]?clsMap[top].emoji+' ':'')+top+'  '+topPct+'%', 18, 36);
      } catch (e) {
        console.error(e);
        result.innerHTML = '<div>Không đoán được. Thử ánh sáng rõ hơn, đưa vật gần giữa khung.</div>';
      }
    }

    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('on'));
        btn.classList.add('on');
        mode = btn.dataset.mode;
        if (stream) { stream.getTracks().forEach(t=>t.stop()); stream=null; video.srcObject=null; }
        buildSamples();
      };
    });
    document.getElementById('btnTrain').onclick = train;
    document.getElementById('btnCam').onclick = startCam;
    document.getElementById('btnGuess').onclick = guess;

    (async () => {
      await loadModels();
      await buildSamples();
    })();
    try {
      const g = localStorage.getItem('ai_grade')||'1';
      document.getElementById('backLink').href='lam-quen-voi-ai.html#lop'+g;
    } catch(e){}
  </script>
</body>
</html>
