<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Máy học | Làm quen với AI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --blue:#0b5fff; --green:#00a86b; --purple:#7c3aed; --orange:#f59e0b; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Be Vietnam Pro',system-ui,sans-serif; background:linear-gradient(160deg,#e0e7ff,#ecfdf5,#fef3c7); min-height:100vh; color:#0f172a; }
    .topbar { background:#fff; box-shadow:0 2px 12px rgba(0,0,0,.06); padding:12px 20px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:50; }
    .topbar a { color:var(--blue); font-weight:700; text-decoration:none; display:inline-flex; align-items:center; gap:6px; font-size:14px; }
    .topbar h1 { font-size:16px; font-weight:800; color:var(--purple); }
    .wrap { max-width:820px; margin:0 auto; padding:20px 16px 48px; }
    .hero { background:linear-gradient(135deg,#7c3aed,#0b5fff); color:#fff; border-radius:20px; padding:20px; text-align:center; margin-bottom:16px; }
    .card { background:#fff; border-radius:18px; box-shadow:0 4px 24px rgba(0,0,0,.08); padding:18px; margin-bottom:14px; }
    .modes { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:14px; }
    .mode-btn { padding:10px 16px; border-radius:999px; border:2px solid #e2e8f0; background:#f8fafc; font-weight:700; font-size:13px; cursor:pointer; font-family:inherit; }
    .mode-btn.on { border-color:var(--purple); background:#ede9fe; color:#5b21b6; }
    .step { font-weight:800; font-size:14px; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
    .step b { width:26px; height:26px; border-radius:50%; background:var(--purple); color:#fff; display:grid; place-items:center; font-size:13px; }
    .samples { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; }
    .group { background:#f8fafc; border-radius:14px; padding:12px; text-align:center; border:2px solid #e2e8f0; }
    .group h4 { font-size:13px; margin-bottom:8px; }
    .thumbs { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; }
    .thumbs canvas { width:64px; height:64px; border-radius:10px; border:2px solid #cbd5e1; background:#fff; }
    .btn { display:inline-flex; align-items:center; gap:8px; padding:12px 22px; border-radius:999px; font-weight:700; font-size:14px; border:0; cursor:pointer; font-family:inherit; margin:6px 4px; }
    .btn-purple { background:var(--purple); color:#fff; }
    .btn-blue { background:var(--blue); color:#fff; }
    .btn-green { background:var(--green); color:#fff; }
    .btn:disabled { opacity:.45; cursor:not-allowed; }
    .status { text-align:center; font-size:13px; color:#64748b; margin:8px 0; min-height:20px; }
    .video-wrap { position:relative; width:100%; max-width:420px; margin:0 auto; border-radius:16px; overflow:hidden; background:#0f172a; aspect-ratio:4/3; }
    video, #overlay { width:100%; height:100%; object-fit:cover; display:block; }
    #overlay { position:absolute; left:0; top:0; pointer-events:none; }
    .result-box { margin-top:14px; padding:16px; border-radius:14px; background:#f1f5f9; text-align:center; font-weight:800; font-size:17px; min-height:80px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; }
    .result-box .pct { font-size:28px; color:var(--green); }
    .bar { width:100%; max-width:280px; height:12px; background:#e2e8f0; border-radius:999px; overflow:hidden; }
    .bar > div { height:100%; background:linear-gradient(90deg,#0b5fff,#22c55e); border-radius:999px; transition:width .3s; }
    .hint { font-size:12px; color:#64748b; font-weight:600; }
    .conf-list { font-size:12px; color:#475569; font-weight:600; margin-top:4px; }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="lam-quen-voi-ai.html" id="backLink"><i class="fas fa-arrow-left"></i> Quay lại</a>
    <h1><i class="fas fa-brain"></i> AI Máy học</h1>
    <span style="width:80px"></span>
  </div>
  <div class="wrap">
    <div class="hero">
      <h2>🧠 AI học từ ví dụ</h2>
      <p>Chọn nhóm: Đồ dùng · Con vật · Cây cảnh. AI học ảnh mẫu → camera đoán và hiện %.</p>
    </div>

    <div class="card">
      <div class="modes">
        <button class="mode-btn on" data-mode="do_dung">✏️ Đồ dùng</button>
        <button class="mode-btn" data-mode="con_vat">🐶 Con vật</button>
        <button class="mode-btn" data-mode="cay_canh">🌳 Cây cảnh</button>
      </div>
      <div class="step"><b>1</b> Ảnh mẫu để AI học — <span id="modeTitle">Đồ dùng</span></div>
      <div class="samples" id="samples"></div>
      <div style="text-align:center;margin-top:12px">
        <button class="btn btn-purple" id="btnTrain"><i class="fas fa-graduation-cap"></i> Cho AI học nhóm này</button>
      </div>
      <p class="status" id="trainStatus">Chọn nhóm rồi bấm “Cho AI học nhóm này”.</p>
    </div>

    <div class="card">
      <div class="step"><b>2</b> Đưa đồ thật / hình in vào camera</div>
      <div class="video-wrap">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
      </div>
      <div style="text-align:center;margin-top:10px">
        <button class="btn btn-blue" id="btnCam" disabled><i class="fas fa-video"></i> Bật camera</button>
        <button class="btn btn-green" id="btnGuess" disabled><i class="fas fa-search"></i> AI đoán ngay</button>
      </div>
      <div class="result-box" id="result">
        <span>Chưa đoán</span>
        <span class="hint">Học xong → bật camera → đưa vật vào khung hình</span>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/knn-classifier@1.2.4/dist/knn-classifier.min.js"></script>
  <script>
    const MODES = {
      do_dung: {
        title: 'Đồ dùng học tập',
        classes: [
          { id:'But', name:'Bút', emoji:'✏️', draw: drawPen },
          { id:'Sach', name:'Sách', emoji:'📚', draw: drawBook }
        ]
      },
      con_vat: {
        title: 'Con vật',
        classes: [
          { id:'Cho', name:'Chó', emoji:'🐶', draw: (c,v)=>drawAnimal(c,v,'dog') },
          { id:'Meo', name:'Mèo', emoji:'🐱', draw: (c,v)=>drawAnimal(c,v,'cat') },
          { id:'Chim', name:'Chim', emoji:'🐦', draw: (c,v)=>drawAnimal(c,v,'bird') }
        ]
      },
      cay_canh: {
        title: 'Cây cảnh',
        classes: [
          { id:'Cay', name:'Cây', emoji:'🌳', draw: (c,v)=>drawNature(c,v,'tree') },
          { id:'Hoa', name:'Hoa', emoji:'🌸', draw: (c,v)=>drawNature(c,v,'flower') },
          { id:'La', name:'Lá', emoji:'🍃', draw: (c,v)=>drawNature(c,v,'leaf') }
        ]
      }
    };

    let mode = 'do_dung';
    let classCanvases = {};
    let mobilenetModel = null, classifier = null, trained = false, stream = null;

    function drawPen(c, variant) {
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#f8fafc'; ctx.fillRect(0,0,96,96);
      ctx.fillStyle = '#e2e8f0'; ctx.fillRect(0,70,96,26);
      const colors = ['#ef4444','#0b5fff','#22c55e'];
      ctx.save(); ctx.translate(48,48); ctx.rotate((-25+variant*12)*Math.PI/180);
      ctx.fillStyle = colors[variant%3]; ctx.fillRect(-6,-30,12,50);
      ctx.fillStyle = '#334155';
      ctx.beginPath(); ctx.moveTo(-6,20); ctx.lineTo(0,32); ctx.lineTo(6,20); ctx.fill();
      ctx.fillStyle = '#1e293b'; ctx.fillRect(-6,-8,12,4);
      ctx.restore();
    }
    function drawBook(c, variant) {
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#f8fafc'; ctx.fillRect(0,0,96,96);
      const covers = ['#3b82f6','#f59e0b','#a855f7'];
      const x=18+variant*2, y=16+variant*3;
      ctx.fillStyle='#f1f5f9'; ctx.fillRect(x+4,y+4,58,60);
      ctx.fillStyle=covers[variant%3]; ctx.fillRect(x,y,56,58);
      ctx.fillStyle='rgba(0,0,0,.2)'; ctx.fillRect(x,y,8,58);
      ctx.fillStyle='#fff'; ctx.fillRect(x+16,y+18,30,4); ctx.fillRect(x+16,y+28,24,3);
    }
    function drawAnimal(c, variant, type) {
      const ctx = c.getContext('2d');
      ctx.fillStyle = ['#e0f2fe','#fef3c7','#fce7f3'][variant%3];
      ctx.fillRect(0,0,96,96);
      ctx.fillStyle = '#86efac'; ctx.fillRect(0,70,96,26);
      const cx=48, cy=48;
      if (type==='dog') {
        ctx.fillStyle='#d97706';
        ctx.beginPath(); ctx.ellipse(cx,cy+8,28,20,0,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx+22,cy-8,16,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#0f172a'; ctx.beginPath(); ctx.arc(cx+28,cy-10,3,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#d97706'; ctx.beginPath(); ctx.ellipse(cx+14,cy-18,8,5,0.3,0,Math.PI*2); ctx.fill();
      } else if (type==='cat') {
        ctx.fillStyle='#fb923c';
        ctx.beginPath(); ctx.ellipse(cx,cy+10,26,18,0,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx,cy-8,18,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.moveTo(cx-14,cy-18); ctx.lineTo(cx-10,cy-34); ctx.lineTo(cx-2,cy-18); ctx.fill();
        ctx.beginPath(); ctx.moveTo(cx+14,cy-18); ctx.lineTo(cx+10,cy-34); ctx.lineTo(cx+2,cy-18); ctx.fill();
        ctx.fillStyle='#0f172a'; ctx.beginPath(); ctx.arc(cx-6,cy-10,3,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx+6,cy-10,3,0,Math.PI*2); ctx.fill();
      } else {
        ctx.fillStyle='#38bdf8';
        ctx.beginPath(); ctx.ellipse(cx,cy+4,22,14,0,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx+16,cy-8,12,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#fbbf24';
        ctx.beginPath(); ctx.moveTo(cx+26,cy-8); ctx.lineTo(cx+38,cy-4); ctx.lineTo(cx+26,cy); ctx.fill();
        ctx.fillStyle='#0f172a'; ctx.beginPath(); ctx.arc(cx+18,cy-10,2.5,0,Math.PI*2); ctx.fill();
      }
    }
    function drawNature(c, variant, type) {
      const ctx = c.getContext('2d');
      ctx.fillStyle = ['#e0f2fe','#fef9c3','#fce7f3'][variant%3];
      ctx.fillRect(0,0,96,96);
      ctx.fillStyle='#86efac'; ctx.fillRect(0,72,96,24);
      if (type==='tree') {
        ctx.fillStyle='#854d0e'; ctx.fillRect(42,48,12,30);
        ctx.fillStyle=['#16a34a','#22c55e','#15803d'][variant%3];
        ctx.beginPath(); ctx.arc(48,40,22,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(36,48,14,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(60,48,14,0,Math.PI*2); ctx.fill();
      } else if (type==='flower') {
        ctx.fillStyle='#22c55e'; ctx.fillRect(46,50,4,28);
        const petal = ['#f472b6','#fbbf24','#a78bfa'][variant%3];
        for (let i=0;i<6;i++) {
          const a = i*Math.PI/3;
          ctx.fillStyle=petal;
          ctx.beginPath(); ctx.ellipse(48+Math.cos(a)*12, 42+Math.sin(a)*12, 8, 6, a, 0, Math.PI*2); ctx.fill();
        }
        ctx.fillStyle='#fde047'; ctx.beginPath(); ctx.arc(48,42,7,0,Math.PI*2); ctx.fill();
      } else {
        ctx.fillStyle=['#22c55e','#4ade80','#16a34a'][variant%3];
        ctx.beginPath();
        ctx.moveTo(20,70); ctx.quadraticCurveTo(48,10,76,70); ctx.quadraticCurveTo(48,50,20,70);
        ctx.fill();
        ctx.strokeStyle='#15803d'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.moveTo(48,70); ctx.quadraticCurveTo(40,40,48,20); ctx.stroke();
      }
    }

    function buildSamples() {
      const box = document.getElementById('samples');
      box.innerHTML = '';
      classCanvases = {};
      const m = MODES[mode];
      document.getElementById('modeTitle').textContent = m.title;
      m.classes.forEach(cls => {
        const g = document.createElement('div');
        g.className = 'group';
        g.innerHTML = '<h4>'+cls.emoji+' '+cls.name+'</h4><div class="thumbs"></div>';
        const thumbs = g.querySelector('.thumbs');
        classCanvases[cls.name] = [];
        for (let i=0;i<3;i++) {
          const c = document.createElement('canvas');
          c.width=96; c.height=96;
          cls.draw(c, i);
          thumbs.appendChild(c);
          classCanvases[cls.name].push(c);
        }
        box.appendChild(g);
      });
      trained = false;
      document.getElementById('btnCam').disabled = true;
      document.getElementById('btnGuess').disabled = true;
      document.getElementById('trainStatus').textContent = 'Bấm “Cho AI học nhóm này” để bắt đầu.';
      document.getElementById('result').innerHTML = '<span>Chưa đoán</span><span class="hint">Đổi nhóm → học lại → rồi đoán</span>';
    }

    async function loadModels() {
      document.getElementById('trainStatus').textContent = 'Đang tải mô hình máy học…';
      try {
        await tf.setBackend('webgl'); await tf.ready();
        mobilenetModel = await mobilenet.load({ version:2, alpha:0.5 });
        classifier = knnClassifier.create();
        document.getElementById('trainStatus').textContent = 'Sẵn sàng! Chọn nhóm và cho AI học.';
        document.getElementById('btnTrain').disabled = false;
      } catch(e) {
        document.getElementById('trainStatus').textContent = 'Không tải được mô hình. Kiểm tra mạng.';
      }
    }

    async function train() {
      if (!mobilenetModel || !classifier) return;
      document.getElementById('btnTrain').disabled = true;
      document.getElementById('trainStatus').textContent = 'AI đang học…';
      classifier.clearAllClasses();
      for (const name of Object.keys(classCanvases)) {
        for (const c of classCanvases[name]) {
          for (let k=0;k<5;k++) {
            const act = mobilenetModel.infer(c, true);
            classifier.addExample(act, name);
            act.dispose();
          }
        }
      }
      trained = true;
      document.getElementById('trainStatus').textContent = 'AI đã học xong nhóm “'+MODES[mode].title+'”! Bật camera để đoán.';
      document.getElementById('btnCam').disabled = false;
      document.getElementById('btnTrain').disabled = false;
    }

    async function startCam() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        overlay.width = video.videoWidth || 640;
        overlay.height = video.videoHeight || 480;
        document.getElementById('btnGuess').disabled = false;
        document.getElementById('trainStatus').textContent = 'Đưa vật vào giữa khung rồi bấm “AI đoán ngay”.';
      } catch(e) {
        document.getElementById('trainStatus').textContent = 'Không mở được camera. Hãy cho phép quyền camera.';
      }
    }

    async function guess() {
      if (!trained || !stream) return;
      document.getElementById('result').innerHTML = '<span>AI đang nhìn…</span>';
      try {
        const act = mobilenetModel.infer(video, true);
        const pred = await classifier.predictClass(act, 10);
        act.dispose();
        const label = pred.label;
        const pct = Math.round((pred.confidences[label]||0)*100);
        const m = MODES[mode];
        const cls = m.classes.find(c => c.name === label);
        const emoji = cls ? cls.emoji : '🔍';
        let confHtml = '';
        Object.keys(pred.confidences).forEach(k => {
          confHtml += k + ': ' + Math.round(pred.confidences[k]*100) + '% · ';
        });
        document.getElementById('result').innerHTML =
          '<span>'+emoji+' AI đoán: <strong style="color:#7c3aed">'+label+'</strong></span>'+
          '<span class="pct">'+pct+'%</span>'+
          '<div class="bar"><div style="width:'+pct+'%"></div></div>'+
          '<span class="conf-list">'+confHtml.slice(0,-3)+'</span>';
        const ctx = overlay.getContext('2d');
        ctx.clearRect(0,0,overlay.width,overlay.height);
        ctx.fillStyle='rgba(124,58,237,.9)';
        ctx.fillRect(10,10,220,36);
        ctx.fillStyle='#fff';
        ctx.font='bold 18px Be Vietnam Pro,sans-serif';
        ctx.fillText(emoji+' '+label+' '+pct+'%', 18, 34);
      } catch(e) {
        document.getElementById('result').innerHTML = '<span>Không đoán được. Thử ánh sáng rõ hơn.</span>';
      }
    }

    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('on'));
        btn.classList.add('on');
        mode = btn.dataset.mode;
        if (stream) { stream.getTracks().forEach(t=>t.stop()); stream=null; video.srcObject=null; }
        buildSamples();
      };
    });
    document.getElementById('btnTrain').disabled = true;
    document.getElementById('btnTrain').onclick = train;
    document.getElementById('btnCam').onclick = startCam;
    document.getElementById('btnGuess').onclick = guess;
    buildSamples();
    loadModels();
    try {
      const g = localStorage.getItem('ai_grade') || '1';
      document.getElementById('backLink').href = 'lam-quen-voi-ai.html#lop'+g;
    } catch(e) {}
  </script>
</body>
</html>
