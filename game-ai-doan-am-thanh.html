<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Đoán Âm Thanh | Làm quen với AI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --blue:#0b5fff; --green:#00a86b; --orange:#ff7a00; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Be Vietnam Pro',system-ui,sans-serif; background:linear-gradient(160deg,#ecfeff,#fdf4ff,#fef3c7); min-height:100vh; color:#0f172a; }
    .topbar { background:#fff; box-shadow:0 2px 12px rgba(0,0,0,.06); padding:12px 20px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:50; }
    .topbar a { color:var(--blue); font-weight:700; text-decoration:none; display:inline-flex; align-items:center; gap:6px; font-size:14px; }
    .topbar h1 { font-size:17px; font-weight:800; color:var(--orange); }
    .wrap { max-width:720px; margin:0 auto; padding:20px 16px 48px; }
    .hero { background:linear-gradient(135deg,#f59e0b,#ef4444); color:#fff; border-radius:20px; padding:22px; text-align:center; margin-bottom:18px; }
    .card { background:#fff; border-radius:18px; box-shadow:0 4px 24px rgba(0,0,0,.08); padding:22px; margin-bottom:16px; }
    .level-tabs { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; justify-content:center; }
    .level-tab { padding:8px 16px; border-radius:999px; border:2px solid #e2e8f0; background:#f8fafc; font-weight:700; font-size:13px; cursor:pointer; }
    .level-tab.active { background:var(--orange); color:#fff; border-color:var(--orange); }
    .score-bar { display:flex; justify-content:space-between; font-weight:700; font-size:14px; background:#f8fafc; padding:12px 16px; border-radius:12px; margin-bottom:16px; }
    .sound-btn {
      width:100%; max-width:280px; margin:0 auto 20px; display:flex; flex-direction:column; align-items:center; gap:10px;
      padding:28px; border-radius:20px; border:0; background:linear-gradient(135deg,#0b5fff,#7c3aed);
      color:#fff; cursor:pointer; font-family:inherit; box-shadow:0 8px 24px rgba(11,95,255,.3); transition:.2s;
    }
    .sound-btn:hover { transform:scale(1.03); }
    .sound-btn.playing { animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{box-shadow:0 8px 24px rgba(11,95,255,.3)} 50%{box-shadow:0 8px 32px rgba(124,58,237,.55)} }
    .sound-btn .icon { font-size:48px; }
    .sound-btn .label { font-weight:800; font-size:16px; }
    .choices { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .choice { padding:18px 12px; border-radius:16px; border:3px solid #e2e8f0; background:#fff; cursor:pointer; text-align:center; font-weight:700; font-size:15px; transition:.2s; }
    .choice:hover { border-color:var(--blue); background:#eef4ff; }
    .choice .em { font-size:36px; display:block; margin-bottom:6px; }
    .choice.correct { border-color:var(--green); background:#ecfdf5; color:#065f46; }
    .choice.wrong { border-color:#ef4444; background:#fef2f2; color:#991b1b; }
    .choice.disabled { pointer-events:none; opacity:.85; }
    .fb { margin-top:14px; padding:14px; border-radius:12px; font-size:14px; font-weight:600; display:none; text-align:center; }
    .fb.show { display:block; }
    .fb.ok { background:#ecfdf5; color:#065f46; }
    .fb.err { background:#fef2f2; color:#991b1b; }
    .btn { display:inline-flex; align-items:center; gap:8px; padding:12px 22px; border-radius:999px; font-weight:700; font-size:14px; border:0; cursor:pointer; background:var(--blue); color:#fff; margin-top:12px; font-family:inherit; }
    .btn-outline { background:#fff; border:2px solid var(--blue); color:var(--blue); }
    .hint { text-align:center; font-size:13px; color:#64748b; margin-bottom:12px; }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="lam-quen-voi-ai.html" id="backLink"><i class="fas fa-arrow-left"></i> Quay lại</a>
    <h1><i class="fas fa-volume-up"></i> Nghe tiếng đoán vật</h1>
    <span style="width:80px"></span>
  </div>
  <div class="wrap">
    <div class="hero">
      <h2>🔊 Nghe tiếng thật — chọn đúng hình</h2>
      <p>Bấm nút nghe âm thanh thật (chó sủa, mèo kêu…). Sau đó chọn hình đúng!</p>
    </div>
    <div class="card">
      <div class="level-tabs">
        <button class="level-tab active" data-level="1">Lớp 1–2 · Dễ</button>
        <button class="level-tab" data-level="2">Lớp 3–4 · Vừa</button>
        <button class="level-tab" data-level="3">Lớp 5 · Khó</button>
      </div>
      <div class="score-bar">
        <span>Câu: <strong id="qNum">1</strong>/<span id="qTotal">8</span></span>
        <span>Điểm: <strong id="score" style="color:var(--green)">0</strong></span>
      </div>
      <p class="hint">① Bấm nghe tiếng thật → ② Hết tiếng, AI tự chọn đáp án đúng</p>
      <button class="sound-btn" id="playBtn">
        <span class="icon"><i class="fas fa-play-circle"></i></span>
        <span class="label">Bấm để nghe tiếng thật</span>
      </button>
      <div class="choices" id="choices"></div>
      <div class="fb" id="feedback"></div>
      <div style="text-align:center">
        <button class="btn" id="nextBtn" style="display:none"><i class="fas fa-arrow-right"></i> Câu tiếp</button>
        <button class="btn btn-outline" id="restartBtn" style="display:none;margin-left:8px"><i class="fas fa-redo"></i> Chơi lại</button>
      </div>
    </div>
  </div>
  <script>
    // Real sound URLs from Mixkit (free, royalty-free)
    const levels = {
      1: [
        { id:'dog', name:'Chó', emoji:'🐶', src:'https://assets.mixkit.co/active_storage/sfx/1/1-preview.mp3' },
        { id:'cat', name:'Mèo', emoji:'🐱', src:'https://assets.mixkit.co/active_storage/sfx/91/91-preview.mp3' },
        { id:'bird', name:'Chim', emoji:'🐦', src:'https://assets.mixkit.co/active_storage/sfx/17/17-preview.mp3' },
        { id:'cow', name:'Bò', emoji:'🐄', src:'https://assets.mixkit.co/active_storage/sfx/1744/1744-preview.mp3' },
        { id:'rooster', name:'Gà trống', emoji:'🐓', src:'https://assets.mixkit.co/active_storage/sfx/2470/2470-preview.mp3' },
        { id:'bell', name:'Chuông', emoji:'🔔', src:'https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3' },
        { id:'rain', name:'Mưa', emoji:'🌧️', src:'https://assets.mixkit.co/active_storage/sfx/2392/2392-preview.mp3' },
        { id:'clock', name:'Đồng hồ', emoji:'⏰', src:'https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3' }
      ],
      2: [
        { id:'dog2', name:'Chó', emoji:'🐶', src:'https://assets.mixkit.co/active_storage/sfx/54/54-preview.mp3' },
        { id:'cat2', name:'Mèo', emoji:'🐱', src:'https://assets.mixkit.co/active_storage/sfx/45/45-preview.mp3' },
        { id:'bird2', name:'Chim', emoji:'🐦', src:'https://assets.mixkit.co/active_storage/sfx/1212/1212-preview.mp3' },
        { id:'cow2', name:'Bò', emoji:'🐄', src:'https://assets.mixkit.co/active_storage/sfx/1751/1751-preview.mp3' },
        { id:'phone', name:'Điện thoại', emoji:'📱', src:'https://assets.mixkit.co/active_storage/sfx/2354/2354-preview.mp3' },
        { id:'keyboard', name:'Gõ phím', emoji:'⌨️', src:'https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3' },
        { id:'laugh', name:'Tiếng cười', emoji:'😄', src:'https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3' },
        { id:'rooster2', name:'Gà trống', emoji:'🐓', src:'https://assets.mixkit.co/active_storage/sfx/2470/2470-preview.mp3' }
      ],
      3: [
        { id:'dog3', name:'Chó', emoji:'🐶', src:'https://assets.mixkit.co/active_storage/sfx/60/60-preview.mp3' },
        { id:'lion', name:'Sư tử', emoji:'🦁', src:'https://assets.mixkit.co/active_storage/sfx/6/6-preview.mp3' },
        { id:'bird3', name:'Chim', emoji:'🐦', src:'https://assets.mixkit.co/active_storage/sfx/2466/2466-preview.mp3' },
        { id:'thunder', name:'Sấm sét', emoji:'⛈️', src:'https://assets.mixkit.co/active_storage/sfx/1802/1802-preview.mp3' },
        { id:'rain2', name:'Mưa', emoji:'🌧️', src:'https://assets.mixkit.co/active_storage/sfx/1812/1812-preview.mp3' },
        { id:'alarm', name:'Báo thức', emoji:'⏰', src:'https://assets.mixkit.co/active_storage/sfx/994/994-preview.mp3' },
        { id:'cat3', name:'Mèo', emoji:'🐱', src:'https://assets.mixkit.co/active_storage/sfx/92/92-preview.mp3' },
        { id:'farm', name:'Nông trại', emoji:'🌾', src:'https://assets.mixkit.co/active_storage/sfx/7/7-preview.mp3' }
      ]
    };

    let level = 1, queue = [], idx = 0, score = 0, answered = false;
    let currentAudio = null;

    function shuffle(a){ const b=[...a]; for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; }

    function startLevel(lv) {
      level = lv;
      queue = shuffle(levels[lv]);
      idx = 0; score = 0; answered = false;
      document.getElementById('score').textContent = '0';
      document.getElementById('qTotal').textContent = queue.length;
      document.getElementById('nextBtn').style.display = 'none';
      document.getElementById('restartBtn').style.display = 'none';
      document.getElementById('feedback').className = 'fb';
      loadQ();
    }

    function loadQ() {
      answered = false;
      document.getElementById('qNum').textContent = idx + 1;
      document.getElementById('nextBtn').style.display = 'none';
      document.getElementById('feedback').className = 'fb';
      document.getElementById('playBtn').classList.remove('playing');
      document.getElementById('playBtn').querySelector('.label').textContent = 'Bấm để nghe tiếng thật';
      if (currentAudio) { currentAudio.pause(); currentAudio = null; }

      const correct = queue[idx];
      // distractors from same level, different id base
      const others = shuffle(levels[level].filter(x => x.name !== correct.name)).slice(0, 3);
      const options = shuffle([correct, ...others]);

      const box = document.getElementById('choices');
      box.innerHTML = options.map(o =>
        '<div class="choice" data-id="'+o.id+'"><span class="em">'+o.emoji+'</span>'+o.name+'</div>'
      ).join('');
      box.querySelectorAll('.choice').forEach(el => {
        el.onclick = () => select(el, correct);
      });
    }

    function playSound() {
      const item = queue[idx];
      if (!item) return;
      if (currentAudio) { currentAudio.pause(); currentAudio = null; }
      const btn = document.getElementById('playBtn');
      btn.classList.add('playing');
      btn.querySelector('.label').textContent = 'Đang phát…';
      const audio = new Audio(item.src);
      audio.volume = 1;
      currentAudio = audio;
      audio.onended = () => {
        btn.classList.remove('playing');
        btn.querySelector('.label').textContent = 'AI đang chọn đáp án…';
        // AI tự chọn đáp án đúng khi hết âm thanh
        setTimeout(() => autoSelectCorrect(), 400);
      };
      audio.onerror = () => {
        btn.classList.remove('playing');
        btn.querySelector('.label').textContent = 'Lỗi tải âm thanh — thử lại';
      };
      audio.play().catch(() => {
        btn.classList.remove('playing');
        btn.querySelector('.label').textContent = 'Bấm lại để nghe';
      });
    }

    function autoSelectCorrect() {
      if (answered) return;
      const correct = queue[idx];
      if (!correct) return;
      const el = document.querySelector('.choice[data-id="'+correct.id+'"]');
      if (el) select(el, correct, true);
    }

    function select(el, correct, byAI) {
      if (answered) return;
      answered = true;
      if (currentAudio) { currentAudio.pause(); currentAudio = null; }
      document.getElementById('playBtn').classList.remove('playing');
      document.querySelectorAll('.choice').forEach(c => c.classList.add('disabled'));
      const fb = document.getElementById('feedback');
      if (el.dataset.id === correct.id) {
        el.classList.add('correct');
        score += 10;
        document.getElementById('score').textContent = score;
        fb.className = 'fb show ok';
        fb.innerHTML = byAI
          ? '<i class="fas fa-robot"></i> AI chọn: <strong>'+correct.name+'</strong> '+correct.emoji+' — Đây là đáp án đúng!'
          : '<i class="fas fa-check-circle"></i> Đúng rồi! Đây là tiếng <strong>'+correct.name+'</strong> '+correct.emoji;
      } else {
        el.classList.add('wrong');
        document.querySelectorAll('.choice').forEach(c => { if (c.dataset.id === correct.id) c.classList.add('correct'); });
        fb.className = 'fb show err';
        fb.innerHTML = '<i class="fas fa-times-circle"></i> Chưa đúng. Đáp án là <strong>'+correct.name+'</strong> '+correct.emoji;
      }
      if (idx < queue.length - 1) document.getElementById('nextBtn').style.display = 'inline-flex';
      else {
        document.getElementById('restartBtn').style.display = 'inline-flex';
        fb.innerHTML += '<br><br>🎉 Hoàn thành! Điểm: <strong>'+score+'</strong>/'+(queue.length*10);
      }
    }

    document.querySelectorAll('.level-tab').forEach(tab => {
      tab.onclick = () => {
        document.querySelectorAll('.level-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        startLevel(+tab.dataset.level);
      };
    });
    document.getElementById('playBtn').onclick = playSound;
    document.getElementById('nextBtn').onclick = () => { idx++; loadQ(); };
    document.getElementById('restartBtn').onclick = () => startLevel(level);
    try {
      const g = localStorage.getItem('ai_grade') || '1';
      document.getElementById('backLink').href = 'lam-quen-voi-ai.html#lop' + g;
    } catch(e) {}
    startLevel(1);
  </script>
</body>
</html>
