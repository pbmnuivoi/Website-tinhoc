<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trò chơi đối thoại: AI làm việc – Con người kiểm soát | Tin học Tiểu học</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --blue:#0b5fff; --green:#00a86b; --red:#ef4444; --purple:#7c3aed; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Be Vietnam Pro',system-ui,sans-serif; background:linear-gradient(160deg,#e0e7ff,#f0fdf4); min-height:100vh; color:#0f172a; }
    .topbar { background:#fff; box-shadow:0 2px 12px rgba(0,0,0,.06); padding:12px 20px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:50; }
    .topbar a { color:var(--blue); font-weight:700; text-decoration:none; display:inline-flex; align-items:center; gap:6px; font-size:14px; }
    .topbar h1 { font-size:15px; font-weight:800; color:var(--purple); }
    .wrap { max-width:640px; margin:0 auto; padding:20px 16px 60px; }
    .hero { background:linear-gradient(135deg,#7c3aed,#0b5fff); color:#fff; border-radius:20px; padding:20px; text-align:center; margin-bottom:16px; }
    .chat { background:#fff; border-radius:18px; box-shadow:0 4px 24px rgba(0,0,0,.08); padding:16px; min-height:320px; display:flex; flex-direction:column; gap:12px; }
    .msg { max-width:85%; padding:12px 16px; border-radius:16px; font-size:14px; line-height:1.5; }
    .msg.ai { background:#eef2ff; align-self:flex-start; border-bottom-left-radius:4px; }
    .msg.user { background:#dcfce7; align-self:flex-end; border-bottom-right-radius:4px; }
    .msg .who { font-size:11px; font-weight:700; margin-bottom:4px; opacity:0.7; }
    .choices { display:flex; flex-direction:column; gap:8px; margin-top:12px; }
    .choice-btn { padding:12px 16px; border-radius:12px; border:2px solid #e2e8f0; background:#f8fafc; font-weight:600; font-size:14px; cursor:pointer; text-align:left; transition:0.2s; }
    .choice-btn:hover { border-color:var(--blue); background:#eef4ff; }
    .feedback { margin-top:12px; padding:12px; border-radius:12px; font-size:14px; display:none; }
    .feedback.show { display:block; }
    .feedback.ok { background:#dcfce7; border-left:4px solid var(--green); }
    .feedback.bad { background:#fee2e2; border-left:4px solid var(--red); }
    .btn { display:inline-flex; align-items:center; gap:8px; padding:12px 20px; border-radius:999px; font-weight:700; font-size:14px; border:0; cursor:pointer; background:var(--blue); color:#fff; margin-top:12px; }
    .score { text-align:center; font-size:18px; font-weight:700; margin:12px 0; }
    .hidden { display:none; }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="lam-quen-voi-ai.html"><i class="fas fa-arrow-left"></i> Quay lại</a>
    <h1>💬 AI làm việc – Em kiểm soát</h1>
    <span style="width:70px"></span>
  </div>
  <div class="wrap">
    <div class="hero">
      <h2>🤖 Trò chơi đối thoại</h2>
      <p>AI trả lời → Em kiểm tra đúng/sai → Tiếp tục câu hỏi khác. Tổng 5 câu.</p>
    </div>
    <div class="score" id="scoreDisplay">Câu 1/5 • Điểm: 0</div>
    <div class="chat" id="chat"></div>
    <div id="choicesArea"></div>
    <div id="endBox" class="hidden" style="text-align:center;margin-top:20px">
      <div style="font-size:42px;font-weight:800;color:var(--purple)" id="finalScore">0/5</div>
      <p id="finalMsg" style="margin:10px 0;font-weight:600"></p>
      <button class="btn" onclick="location.reload()"><i class="fas fa-redo"></i> Chơi lại</button>
      <a href="lam-quen-voi-ai.html" class="btn" style="background:var(--green);margin-left:8px"><i class="fas fa-home"></i> Về trang AI</a>
    </div>
  </div>
  <script>
    const dialogs = [
      {
        ai: "2 + 2 = 5. Đúng không?",
        correct: false,
        explainOk: "Em đúng! 2+2=4, AI đã sai. Em đã kiểm soát tốt.",
        explainBad: "AI sai rồi! 2+2 phải bằng 4. Em cần phát hiện lỗi của AI."
      },
      {
        ai: "Con mèo có 4 chân. Đúng không?",
        correct: true,
        explainOk: "Đúng! AI nói đúng. Em xác nhận chính xác.",
        explainBad: "Thực ra AI đúng lần này. Con mèo có 4 chân."
      },
      {
        ai: "Mặt trời mọc ở hướng Tây. Đúng không?",
        correct: false,
        explainOk: "Tuyệt! AI sai. Mặt trời mọc ở hướng Đông.",
        explainBad: "AI sai. Mặt trời mọc ở Đông, lặn ở Tây."
      },
      {
        ai: "Nước sôi ở 100 độ C (ở điều kiện bình thường). Đúng không?",
        correct: true,
        explainOk: "Chính xác! AI đúng. Em kiểm tra tốt.",
        explainBad: "AI đúng lần này. Nước sôi ở khoảng 100°C."
      },
      {
        ai: "Một tuần có 8 ngày. Đúng không?",
        correct: false,
        explainOk: "Giỏi! AI sai. Một tuần có 7 ngày.",
        explainBad: "AI sai. Một tuần chỉ có 7 ngày thôi."
      }
    ];
    let idx = 0, score = 0;
    const chat = document.getElementById('chat');
    const choicesArea = document.getElementById('choicesArea');
    const scoreDisplay = document.getElementById('scoreDisplay');

    function addMsg(who, text) {
      const div = document.createElement('div');
      div.className = 'msg ' + (who === 'AI' ? 'ai' : 'user');
      div.innerHTML = `<div class="who">${who}</div>${text}`;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function showQuestion() {
      if (idx >= dialogs.length) {
        choicesArea.innerHTML = '';
        document.getElementById('endBox').classList.remove('hidden');
        document.getElementById('finalScore').textContent = score + '/5';
        document.getElementById('finalMsg').textContent = score === 5 ? 'Xuất sắc! Em kiểm soát AI rất tốt! 🌟' : score >= 3 ? 'Tốt lắm! Em biết kiểm tra AI. 👍' : 'Cố gắng thêm nhé! Luôn kiểm tra AI. 💪';
        return;
      }
      scoreDisplay.textContent = `Câu ${idx+1}/5 • Điểm: ${score}`;
      const d = dialogs[idx];
      addMsg('AI', d.ai);
      choicesArea.innerHTML = `
        <div class="choices">
          <button class="choice-btn" onclick="answer(true)">✅ Đúng (AI nói đúng)</button>
          <button class="choice-btn" onclick="answer(false)">❌ Sai (AI nói sai)</button>
        </div>
        <div class="feedback" id="fb"></div>`;
    }

    function answer(userSaysCorrect) {
      const d = dialogs[idx];
      const isRight = (userSaysCorrect === d.correct);
      if (isRight) score++;
      addMsg('Em', userSaysCorrect ? 'Em nghĩ AI đúng' : 'Em nghĩ AI sai');
      const fb = document.getElementById('fb');
      fb.textContent = isRight ? d.explainOk : d.explainBad;
      fb.className = 'feedback show ' + (isRight ? 'ok' : 'bad');
      choicesArea.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
      setTimeout(() => {
        idx++;
        showQuestion();
      }, 2000);
    }
    showQuestion();
  </script>
</body>
</html>
