<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trò chơi Mở quà | Góc giáo viên</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(160deg, #fce4ec 0%, #f3e5f5 50%, #e8eaf6 100%);
      min-height: 100vh; color: #263238;
    }
    .topbar {
      background: white; box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      padding: 12px 20px; display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 50;
    }
    .topbar a { color: #c2185b; font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
    .topbar h1 { font-size: 18px; font-weight: 800; color: #c2185b; }
    .wrap { max-width: 800px; margin: 0 auto; padding: 20px 16px 48px; }
    .card {
      background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      padding: 22px; margin-bottom: 18px;
    }
    .card h2 { font-size: 18px; font-weight: 800; margin-bottom: 12px; color: #c2185b; }
    label { font-weight: 700; font-size: 13px; display: block; margin-bottom: 4px; }
    input[type=text], textarea, select {
      width: 100%; padding: 10px 12px; border: 2px solid #e0e0e0; border-radius: 10px;
      font-family: inherit; font-size: 14px; outline: none; margin-bottom: 10px;
    }
    input:focus, textarea:focus, select:focus { border-color: #c2185b; }
    .q-block {
      background: #fce4ec; border-radius: 12px; padding: 14px; margin-bottom: 12px;
    }
    .ans-row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }
    .ans-row input[type=text] { flex: 1; margin-bottom: 0; min-width: 120px; }
    .ans-row input[type=radio] { width: 18px; height: 18px; accent-color: #c2185b; flex-shrink: 0; }
    .ans-img-input { width: 100%; max-width: 280px; font-size: 12px !important; padding: 6px 10px !important; margin-bottom: 0 !important; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; border-radius: 999px;
      font-weight: 800; font-size: 14px; border: none; cursor: pointer; font-family: inherit; transition: 0.2s;
    }
    .btn-primary { background: linear-gradient(135deg, #c2185b, #f48fb1); color: white; box-shadow: 0 6px 18px rgba(194,24,91,0.3); }
    .btn-outline { background: white; border: 2px solid #c2185b; color: #c2185b; }
    .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 8px; }
    .btn-json { background: #eceff1; border: 2px solid #90a4ae; color: #455a64; }
    .gift-box { text-align: center; padding: 30px; cursor: pointer; user-select: none; }
    .gift-icon { font-size: 80px; transition: 0.3s; display: inline-block; }
    .gift-icon:hover { transform: scale(1.1) rotate(-5deg); }
    .gift-icon.open { animation: openGift 0.6s ease; }
    @keyframes openGift {
      0% { transform: scale(1); }
      40% { transform: scale(1.3) rotate(10deg); }
      100% { transform: scale(1); }
    }
    .options { display: grid; gap: 10px; margin-top: 16px; }
    .opt-btn {
      padding: 14px 18px; border-radius: 12px; border: 2px solid #e0e0e0; background: white;
      font-weight: 700; font-size: 15px; cursor: pointer; text-align: left; transition: 0.2s; font-family: inherit;
      display: flex; align-items: center; gap: 12px;
    }
    .opt-btn:hover { border-color: #c2185b; background: #fce4ec; }
    .opt-btn.correct { border-color: #4caf50; background: #e8f5e9; color: #2e7d32; }
    .opt-btn.wrong { border-color: #e53935; background: #ffebee; color: #c62828; }
    .opt-btn img { width: 48px; height: 48px; object-fit: cover; border-radius: 8px; flex-shrink: 0; }
    .feedback { font-size: 20px; font-weight: 800; margin-top: 16px; min-height: 30px; text-align: center; }
    .q-img { max-width: 100%; max-height: 180px; border-radius: 12px; margin: 12px auto; display: block; object-fit: contain; }
    .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 100; overflow: hidden; }
    .confetti span { position: absolute; width: 12px; height: 12px; border-radius: 2px; animation: fall 2.5s ease-out forwards; }
    @keyframes fall {
      0% { transform: translateY(-20px) rotate(0); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }
    .hidden { display: none !important; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
    #jsonFile { display: none; }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="goc-giao-vien.html"><i class="fas fa-arrow-left"></i> Quay lại</a>
    <h1><i class="fas fa-gift"></i> Mở quà Quiz</h1>
    <span style="width:80px"></span>
  </div>
  <div class="wrap">
    <div id="setupScreen">
      <div class="card">
        <h2>⚙️ Cài đặt câu hỏi (1–20 câu)</h2>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">
          <div>
            <label>Thứ tự câu hỏi</label>
            <select id="orderQ">
              <option value="default">Mặc định (theo thứ tự nhập)</option>
              <option value="random">Random câu hỏi</option>
            </select>
          </div>
          <div>
            <label>Thứ tự đáp án</label>
            <select id="orderA">
              <option value="default">Mặc định (theo thứ tự nhập)</option>
              <option value="random">Random đáp án</option>
            </select>
          </div>
        </div>

        <div id="questionsBox"></div>
        <div class="toolbar">
          <button class="btn btn-outline" id="btnAddQ"><i class="fas fa-plus"></i> Thêm câu hỏi</button>
          <button class="btn btn-json" id="btnExport"><i class="fas fa-download"></i> Xuất JSON</button>
          <button class="btn btn-json" id="btnImport"><i class="fas fa-upload"></i> Cập nhật JSON</button>
          <input type="file" id="jsonFile" accept=".json,application/json">
          <button class="btn btn-primary" id="btnStart"><i class="fas fa-play"></i> Bắt đầu chơi</button>
        </div>
      </div>
    </div>
    <div id="playScreen" class="hidden">
      <div class="card">
        <div class="gift-box" id="giftBox">
          <div class="gift-icon" id="giftIcon">🎁</div>
          <p style="margin-top:8px;font-weight:700;color:#c2185b">Bấm vào hộp quà để mở câu hỏi ngẫu nhiên!</p>
        </div>
        <div id="quizArea" class="hidden">
          <h2 id="qText" style="font-size:18px;margin-bottom:8px;text-align:center"></h2>
          <img id="qImg" class="q-img hidden" alt="Ảnh minh họa">
          <div class="options" id="options"></div>
          <div class="feedback" id="feedback"></div>
          <div style="margin-top:16px;text-align:center">
            <button class="btn btn-primary hidden" id="btnNext"><i class="fas fa-gift"></i> Mở quà tiếp</button>
            <button class="btn btn-outline hidden" id="btnFinish"><i class="fas fa-flag-checkered"></i> Kết thúc</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="confetti" id="confetti"></div>
  <script>
    let questions = [], remaining = [], answered = false;
    const $ = id => document.getElementById(id);
    const LABELS = ['A', 'B', 'C', 'D'];

    function makeQBlock(idx, data) {
      const div = document.createElement('div');
      div.className = 'q-block';
      const q = data || { text: '', img: '', answers: [{text:'',img:''},{text:'',img:''},{text:'',img:''},{text:'',img:''}], correct: 0 };
      while (q.answers.length < 4) q.answers.push({ text: '', img: '' });
      div.innerHTML = `
        <label>Câu ${idx + 1}</label>
        <input type="text" class="q-text" placeholder="Nhập câu hỏi..." value="${(q.text||'').replace(/"/g,'&quot;')}">
        <label>Ảnh minh họa câu hỏi (URL – tùy chọn)</label>
        <input type="text" class="q-img-url" placeholder="https://... hoặc để trống" value="${(q.img||'').replace(/"/g,'&quot;')}">
        <label>Đáp án (chọn 1 đúng bằng nút radio · có thể gắn ảnh cho từng đáp án)</label>
        <div class="ans-list">
          ${[0,1,2,3].map(i => `
            <div class="ans-row">
              <input type="radio" name="correct${idx}" value="${i}" ${i===q.correct?'checked':''}>
              <span style="font-weight:800;min-width:18px">${LABELS[i]}</span>
              <input type="text" class="ans-text" placeholder="Đáp án ${LABELS[i]}" value="${(q.answers[i]?.text||'').replace(/"/g,'&quot;')}">
              <input type="text" class="ans-img ans-img-input" placeholder="Link ảnh đáp án ${LABELS[i]} (tùy chọn)" value="${(q.answers[i]?.img||'').replace(/"/g,'&quot;')}">
            </div>
          `).join('')}
        </div>
      `;
      return div;
    }

    function rebuildQuestions(n, list) {
      const box = $('questionsBox');
      box.innerHTML = '';
      for (let i = 0; i < n; i++) box.appendChild(makeQBlock(i, list ? list[i] : null));
    }
    rebuildQuestions(1);

    $('btnAddQ').addEventListener('click', () => {
      const cur = $('questionsBox').children.length;
      if (cur >= 20) return alert('Tối đa 20 câu hỏi');
      $('questionsBox').appendChild(makeQBlock(cur));
    });

    function collectQuestions() {
      const list = [];
      document.querySelectorAll('.q-block').forEach(block => {
        const text = block.querySelector('.q-text').value.trim();
        const img = block.querySelector('.q-img-url').value.trim();
        const ansTexts = [...block.querySelectorAll('.ans-text')].map(i => i.value.trim());
        const ansImgs = [...block.querySelectorAll('.ans-img')].map(i => i.value.trim());
        const answers = [];
        for (let i = 0; i < 4; i++) {
          if (ansTexts[i]) answers.push({ text: ansTexts[i], img: ansImgs[i] || '' });
        }
        const correctIdx = parseInt(block.querySelector('input[type=radio]:checked')?.value || 0, 10);
        if (text && answers.length >= 2) {
          list.push({ text, img, answers: answers.slice(0, 4), correct: Math.min(correctIdx, answers.length - 1) });
        }
      });
      return list;
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // Export JSON
    $('btnExport').addEventListener('click', () => {
      const qs = collectQuestions();
      if (!qs.length) return alert('Chưa có câu hỏi hợp lệ để xuất!');
      const data = {
        tool: 'mo-qua',
        orderQ: $('orderQ').value,
        orderA: $('orderA').value,
        questions: qs
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'mo-qua-cau-hoi.json';
      a.click();
      URL.revokeObjectURL(a.href);
    });

    // Import JSON
    $('btnImport').addEventListener('click', () => $('jsonFile').click());
    $('jsonFile').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          const qs = data.questions || data;
          if (!Array.isArray(qs) || !qs.length) throw new Error('JSON không có danh sách câu hỏi');
          if (qs.length > 20) qs.length = 20;
          if (data.orderQ) $('orderQ').value = data.orderQ;
          if (data.orderA) $('orderA').value = data.orderA;
          // Normalize answers to {text, img}
          const normalized = qs.map(q => {
            const answers = (q.answers || []).map(a => {
              if (typeof a === 'string') return { text: a, img: '' };
              return { text: a.text || '', img: a.img || '' };
            });
            return { text: q.text || '', img: q.img || '', answers, correct: q.correct || 0 };
          });
          rebuildQuestions(normalized.length, normalized);
          alert('Đã tải ' + normalized.length + ' câu hỏi từ JSON!');
        } catch (err) {
          alert('Lỗi đọc JSON: ' + err.message);
        }
        e.target.value = '';
      };
      reader.readAsText(file);
    });

    $('btnStart').addEventListener('click', () => {
      questions = collectQuestions();
      if (!questions.length) return alert('Cần ít nhất 1 câu hỏi hợp lệ (có từ 2 đáp án trở lên)');
      const orderQ = $('orderQ').value;
      remaining = orderQ === 'random' ? shuffle(questions) : [...questions];
      window._orderA = $('orderA').value;
      answered = false;
      $('setupScreen').classList.add('hidden');
      $('playScreen').classList.remove('hidden');
      $('giftBox').classList.remove('hidden');
      $('quizArea').classList.add('hidden');
      $('giftIcon').textContent = '🎁';
      $('giftIcon').classList.remove('open');
    });

    $('giftBox').addEventListener('click', () => {
      if (!$('quizArea').classList.contains('hidden')) return;
      if (!remaining.length) return;
      $('giftIcon').textContent = '✨';
      $('giftIcon').classList.add('open');
      setTimeout(() => {
        $('giftBox').classList.add('hidden');
        loadQuestion();
        $('quizArea').classList.remove('hidden');
      }, 500);
    });

    function loadQuestion() {
      answered = false;
      const q = remaining[0];
      $('qText').textContent = q.text;
      const imgEl = $('qImg');
      if (q.img) {
        imgEl.src = q.img;
        imgEl.classList.remove('hidden');
      } else {
        imgEl.classList.add('hidden');
        imgEl.removeAttribute('src');
      }
      const opts = $('options');
      opts.innerHTML = '';
      let idxs = q.answers.map((_, i) => i);
      if (window._orderA === 'random') idxs = shuffle(idxs);
      idxs.forEach(i => {
        const b = document.createElement('button');
        b.className = 'opt-btn';
        b.dataset.idx = i;
        const ans = q.answers[i];
        if (ans.img) {
          const im = document.createElement('img');
          im.src = ans.img;
          im.alt = '';
          b.appendChild(im);
        }
        const span = document.createElement('span');
        span.textContent = ans.text;
        b.appendChild(span);
        b.addEventListener('click', () => selectAns(i, b));
        opts.appendChild(b);
      });
      $('feedback').textContent = '';
      $('btnNext').classList.add('hidden');
      $('btnFinish').classList.add('hidden');
    }

    function selectAns(idx, btn) {
      if (answered) return;
      answered = true;
      const q = remaining[0];
      const all = $('options').querySelectorAll('.opt-btn');
      all.forEach(b => {
        b.disabled = true;
        const bi = parseInt(b.dataset.idx, 10);
        if (bi === q.correct) b.classList.add('correct');
        else if (bi === idx) b.classList.add('wrong');
      });
      if (idx === q.correct) {
        $('feedback').innerHTML = '🎉 Chúc mừng! Đúng rồi!';
        $('feedback').style.color = '#2e7d32';
        showConfetti();
      } else {
        $('feedback').innerHTML = '❌ Chưa đúng. Đáp án đúng đã được tô xanh.';
        $('feedback').style.color = '#c62828';
      }
      remaining.shift();
      if (remaining.length) $('btnNext').classList.remove('hidden');
      else $('btnFinish').classList.remove('hidden');
    }

    $('btnNext').addEventListener('click', () => {
      $('giftBox').classList.remove('hidden');
      $('quizArea').classList.add('hidden');
      $('giftIcon').textContent = '🎁';
      $('giftIcon').classList.remove('open');
    });

    $('btnFinish').addEventListener('click', () => {
      $('playScreen').classList.add('hidden');
      $('setupScreen').classList.remove('hidden');
    });

    function showConfetti() {
      const box = $('confetti');
      box.innerHTML = '';
      const colors = ['#c2185b','#f48fb1','#fbbf24','#4caf50','#42a5f5'];
      for (let i = 0; i < 50; i++) {
        const s = document.createElement('span');
        s.style.left = Math.random()*100 + '%';
        s.style.background = colors[Math.floor(Math.random()*colors.length)];
        s.style.animationDelay = Math.random()*0.6 + 's';
        box.appendChild(s);
      }
      setTimeout(() => box.innerHTML = '', 2800);
    }
  </script>
</body>
</html>
