<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 – Không tìm thấy trang | Tin học Tiểu học</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #1a73e8;
      --primary-dark: #0d47a1;
      --orange: #ff9800;
      --gray-100: #f5f7fa;
      --gray-600: #546e7a;
      --gray-800: #263238;
    }
    body {
      font-family: 'Nunito', 'Segoe UI', sans-serif;
      background: var(--gray-100);
      color: var(--gray-800);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .box {
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.1);
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
    }
    .icon {
      width: 90px; height: 90px;
      background: linear-gradient(135deg, #e3f2fd, #bbdefb);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
      font-size: 42px;
      color: var(--primary);
    }
    h1 {
      font-size: 72px;
      font-weight: 800;
      color: var(--primary);
      line-height: 1;
      margin-bottom: 8px;
    }
    h2 {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 12px;
    }
    p {
      font-size: 15px;
      color: var(--gray-600);
      margin-bottom: 28px;
      line-height: 1.6;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 28px; border-radius: 25px;
      background: var(--primary); color: white;
      font-weight: 700; font-size: 15px;
      text-decoration: none; border: none; cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
    }
    .btn:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(26,115,232,0.35);
    }
    .links {
      margin-top: 24px;
      font-size: 13px;
      color: var(--gray-600);
    }
    .links a {
      color: var(--primary);
      font-weight: 700;
      text-decoration: none;
      margin: 0 6px;
    }
    .links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon"><i class="fas fa-search"></i></div>
    <h1>404</h1>
    <h2>Trang chưa sẵn sàng</h2>
    <p>Chức năng <strong>Đăng nhập / Đăng ký</strong> đang được phát triển. Vui lòng quay lại trang chủ để tiếp tục khám phá!</p>
    <a href="index.html" class="btn"><i class="fas fa-home"></i> Về trang chủ</a>
    <div class="links">
      <a href="hoc-ma-choi.html">Học mà chơi</a> ·
      <a href="tai-lieu.html">Tài liệu</a> ·
      <a href="goc-hoc-sinh.html">Góc học sinh</a>
    </div>
  </div>
</body>
</html>
