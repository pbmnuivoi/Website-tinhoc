<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English với AI | Làm quen với AI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --blue:#0b5fff; --green:#00a86b; --purple:#7c3aed; --orange:#f59e0b; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Be Vietnam Pro',system-ui,sans-serif; background:linear-gradient(160deg,#dbeafe,#fce7f3,#ecfdf5); min-height:100vh; color:#0f172a; }
    .topbar { background:#fff; box-shadow:0 2px 12px rgba(0,0,0,.06); padding:12px 20px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:50; }
    .topbar a { color:var(--blue); font-weight:700; text-decoration:none; display:inline-flex; align-items:center; gap:6px; font-size:14px; }
    .topbar h1 { font-size:15px; font-weight:800; color:#2563eb; }
    .wrap { max-width:640px; margin:0 auto; padding:20px 16px 48px; }
    .hero { background:linear-gradient(135deg,#2563eb,#7c3aed); color:#fff; border-radius:20px; padding:18px; text-align:center; margin-bottom:14px; }
    .card { background:#fff; border-radius:18px; box-shadow:0 4px 24px rgba(0,0,0,.08); padding:16px; margin-bottom:14px; }
    .video-wrap { position:relative; width:100%; max-width:480px; margin:0 auto; border-radius:16px; overflow:hidden; background:#0f172a; aspect-ratio:4/3; }
    video, #overlay, #preview { width:100%; height:100%; object-fit:cover; display:block; }
    #overlay { position:absolute; left:0; top:0; pointer-events:none; }
    #preview { display:none; position:absolute; left:0; top:0; }
    .btn { display:inline-flex; align-items:center; gap:6px; padding:11px 18px; border-radius:999px; font-weight:700; font-size:13px; border:0; cursor:pointer; font-family:inherit; margin:4px 3px; color:#fff; }
    .btn-blue { background:var(--blue); }
    .btn-green { background:var(--green); }
    .btn-purple { background:var(--purple); }
    .btn-orange { background:var(--orange); }
    .btn-gray { background:#64748b; }
    .btn:disabled { opacity:.45; cursor:not-allowed; }
    .status { text-align:center; font-size:13px; color:#64748b; margin-top:8px; }
    .result { margin-top:14px; padding:18px; border-radius:16px; background:linear-gradient(135deg,#eff6ff,#f5f3ff); text-align:center; display:none; }
    .result.show { display:block; }
    .result .vi { font-size:18px; font-weight:700; color:#334155; margin-bottom:6px; }
    .result .en { font-size:32px; font-weight:800; color:#1d4ed8; letter-spacing:.02em; }
    .result .pct { font-size:13px; color:#64748b; margin-top:6px; font-weight:600; }
    .list { margin-top:12px; text-align:left; max-width:320px; margin-left:auto; margin-right:auto; }
    .list-item { display:flex; justify-content:space-between; align-items:center; padding:8px 10px; border-radius:10px; background:#fff; margin-bottom:6px; font-size:13px; font-weight:700; border:1px solid #e2e8f0; }
    .list-item .en-sm { color:#2563eb; }
    .tips { background:#eff6ff; border-radius:12px; padding:12px; font-size:13px; color:#1e40af; }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="lam-quen-voi-ai.html" id="backLink"><i class="fas fa-arrow-left"></i> Quay lại</a>
    <h1><i class="fas fa-language"></i> English với AI</h1>
    <span style="width:80px"></span>
  </div>
  <div class="wrap">
    <div class="hero">
      <h2>📷 English with AI</h2>
      <p>Chụp đồ vật / con vật → AI nói tên tiếng Việt + đọc tiếng Anh</p>
    </div>
    <div class="card">
      <div class="video-wrap">
        <video id="video" autoplay playsinline muted></video>
        <img id="preview" alt="preview">
        <canvas id="overlay"></canvas>
      </div>
      <div style="text-align:center;margin-top:10px">
        <button class="btn btn-blue" id="btnCam"><i class="fas fa-video"></i> Bật camera</button>
        <button class="btn btn-orange" id="btnSnap" disabled><i class="fas fa-camera"></i> Chụp ảnh</button>
        <label class="btn btn-gray" style="cursor:pointer">
          <i class="fas fa-image"></i> Chọn ảnh
          <input type="file" id="fileInput" accept="image/*" style="display:none">
        </label>
        <button class="btn btn-purple" id="btnAnalyze" disabled><i class="fas fa-magic"></i> AI phân tích</button>
        <button class="btn btn-green" id="btnSpeak" disabled><i class="fas fa-volume-up"></i> Đọc tiếng Anh</button>
      </div>
      <p class="status" id="status">Bật camera hoặc chọn ảnh đồ vật / con vật thật.</p>
      <div class="result" id="result">
        <div class="vi" id="viName">—</div>
        <div class="en" id="enName">—</div>
        <div class="pct" id="pct"></div>
        <div class="list" id="list"></div>
      </div>
    </div>
    <div class="card tips">
      <strong>Gợi ý:</strong> Đưa gần camera một đồ vật rõ (chai nước, sách, điện thoại, chó, mèo…). Ánh sáng đủ giúp AI đoán đúng hơn.
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>
  <script>
    // COCO class → Vietnamese
    const VI = {
      person:'Người', bicycle:'Xe đạp', car:'Xe hơi', motorcycle:'Xe máy', airplane:'Máy bay',
      bus:'Xe buýt', train:'Tàu hỏa', truck:'Xe tải', boat:'Thuyền',
      'traffic light':'Đèn giao thông', 'fire hydrant':'Trụ cứu hỏa', 'stop sign':'Biển dừng',
      'parking meter':'Đồng hồ đỗ xe', bench:'Ghế dài', bird:'Chim', cat:'Mèo', dog:'Chó',
      horse:'Ngựa', sheep:'Cừu', cow:'Bò', elephant:'Voi', bear:'Gấu', zebra:'Ngựa vằn',
      giraffe:'Hươu cao cổ', backpack:'Ba lô', umbrella:'Ô / dù', handbag:'Túi xách',
      tie:'Cà vạt', suitcase:'Va li', frisbee:'Đĩa bay', skis:'Ván trượt tuyết',
      snowboard:'Ván snowboard', 'sports ball':'Bóng', kite:'Diều',
      'baseball bat':'Gậy bóng chày', 'baseball glove':'Găng bóng chày', skateboard:'Ván trượt',
      surfboard:'Ván lướt sóng', 'tennis racket':'Vợt tennis', bottle:'Chai',
      'wine glass':'Ly rượu', cup:'Cốc', fork:'Nĩa', knife:'Dao', spoon:'Thìa', bowl:'Bát',
      banana:'Chuối', apple:'Táo', sandwich:'Bánh sandwich', orange:'Cam', broccoli:'Bông cải xanh',
      carrot:'Cà rốt', hotdog:'Xúc xích', pizza:'Pizza', donut:'Bánh donut', cake:'Bánh ngọt',
      chair:'Ghế', couch:'Ghế sofa', 'potted plant':'Cây cảnh', bed:'Giường',
      'dining table':'Bàn ăn', toilet:'Nhà vệ sinh', tv:'Ti vi', laptop:'Máy tính xách tay',
      mouse:'Chuột máy tính', remote:'Điều khiển', keyboard:'Bàn phím',
      'cell phone':'Điện thoại', microwave:'Lò vi sóng', oven:'Lò nướng', toaster:'Máy nướng bánh',
      sink:'Bồn rửa', refrigerator:'Tủ lạnh', book:'Sách', clock:'Đồng hồ', vase:'Bình hoa',
      scissors:'Kéo', 'teddy bear':'Gấu bông', 'hair drier':'Máy sấy tóc', toothbrush:'Bàn chải đánh răng'
    };

    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const preview = document.getElementById('preview');
    const statusEl = document.getElementById('status');
    const resultEl = document.getElementById('result');
    let model = null, stream = null, lastSource = null, lastDetections = [];

    async function loadModel() {
      statusEl.textContent = 'Đang tải mô hình AI…';
      try {
        await tf.setBackend('webgl');
        await tf.ready();
        model = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
        statusEl.textContent = 'AI sẵn sàng. Bật camera hoặc chọn ảnh.';
      } catch (e) {
        console.error(e);
        statusEl.textContent = 'Không tải được mô hình. Kiểm tra mạng.';
      }
    }

    async function startCam() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        video.style.display = 'block';
        preview.style.display = 'none';
        overlay.width = video.videoWidth || 640;
        overlay.height = video.videoHeight || 480;
        document.getElementById('btnSnap').disabled = false;
        document.getElementById('btnAnalyze').disabled = false;
        lastSource = video;
        statusEl.textContent = 'Camera đã bật. Đưa đồ vật vào khung rồi Chụp hoặc Phân tích.';
      } catch (e) {
        statusEl.textContent = 'Không mở được camera.';
      }
    }

    function snap() {
      if (!stream) return;
      const c = document.createElement('canvas');
      c.width = video.videoWidth || 640;
      c.height = video.videoHeight || 480;
      c.getContext('2d').drawImage(video, 0, 0);
      preview.src = c.toDataURL('image/jpeg', 0.92);
      preview.style.display = 'block';
      video.style.display = 'none';
      lastSource = preview;
      document.getElementById('btnAnalyze').disabled = false;
      statusEl.textContent = 'Đã chụp. Bấm “AI phân tích”.';
      // stop live stream optional - keep for re-snap
    }

    function onFile(e) {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      const url = URL.createObjectURL(f);
      preview.onload = () => {
        preview.style.display = 'block';
        video.style.display = 'none';
        overlay.width = preview.naturalWidth || 640;
        overlay.height = preview.naturalHeight || 480;
        lastSource = preview;
        document.getElementById('btnAnalyze').disabled = false;
        statusEl.textContent = 'Đã chọn ảnh. Bấm “AI phân tích”.';
      };
      preview.src = url;
    }

    function drawBoxes(dets, w, h) {
      const ctx = overlay.getContext('2d');
      overlay.width = w; overlay.height = h;
      ctx.clearRect(0, 0, w, h);
      dets.forEach(d => {
        const [x, y, width, height] = d.bbox;
        ctx.strokeStyle = '#22c55e';
        ctx.lineWidth = 3;
        ctx.strokeRect(x, y, width, height);
        const label = (VI[d.class] || d.class) + ' · ' + d.class;
        ctx.font = 'bold 14px Be Vietnam Pro,sans-serif';
        const tw = ctx.measureText(label).width + 10;
        ctx.fillStyle = 'rgba(34,197,94,0.9)';
        ctx.fillRect(x, Math.max(0, y - 22), tw, 22);
        ctx.fillStyle = '#fff';
        ctx.fillText(label, x + 5, Math.max(14, y - 6));
      });
    }

    async function analyze() {
      if (!model || !lastSource) return;
      statusEl.textContent = 'AI đang nhìn ảnh…';
      document.getElementById('btnAnalyze').disabled = true;
      try {
        const dets = await model.detect(lastSource, 6, 0.35);
        document.getElementById('btnAnalyze').disabled = false;
        if (!dets.length) {
          resultEl.classList.add('show');
          document.getElementById('viName').textContent = 'Không nhận ra đồ vật rõ';
          document.getElementById('enName').textContent = 'Try again';
          document.getElementById('pct').textContent = 'Đưa vật gần hơn, đủ sáng, ít đồ trong khung.';
          document.getElementById('list').innerHTML = '';
          document.getElementById('btnSpeak').disabled = true;
          statusEl.textContent = 'Thử chụp lại.';
          return;
        }
        lastDetections = dets;
        const w = lastSource.videoWidth || lastSource.naturalWidth || lastSource.width || 640;
        const h = lastSource.videoHeight || lastSource.naturalHeight || lastSource.height || 480;
        drawBoxes(dets, w, h);

        const top = dets[0];
        const en = top.class;
        const vi = VI[en] || en;
        const pct = Math.round(top.score * 100);
        document.getElementById('viName').textContent = '🇻🇳 ' + vi;
        document.getElementById('enName').textContent = '🇬🇧 ' + en;
        document.getElementById('pct').textContent = 'Độ tin cậy: ' + pct + '%';
        let html = '';
        dets.slice(0, 5).forEach(d => {
          html += `<div class="list-item"><span>🇻🇳 ${VI[d.class]||d.class}</span><span class="en-sm">🇬🇧 ${d.class}</span><span>${Math.round(d.score*100)}%</span></div>`;
        });
        document.getElementById('list').innerHTML = html;
        resultEl.classList.add('show');
        document.getElementById('btnSpeak').disabled = false;
        statusEl.textContent = 'Xong! Bấm “Đọc tiếng Anh” để nghe phát âm.';
        // auto speak once
        speakEnglish(en);
      } catch (e) {
        console.error(e);
        document.getElementById('btnAnalyze').disabled = false;
        statusEl.textContent = 'Lỗi phân tích. Thử ảnh khác.';
      }
    }

    function speakEnglish(text) {
      if (!text) return;
      try { speechSynthesis.cancel(); } catch (e) {}
      // Prefer Google TTS fallback via audio for clearer EN
      const q = encodeURIComponent(text);
      const audio = new Audio('https://translate.google.com/translate_tts?ie=UTF-8&q=' + q + '&tl=en&client=tw-ob');
      audio.play().catch(() => {
        // fallback Web Speech
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US';
        u.rate = 0.9;
        speechSynthesis.speak(u);
      });
    }

    document.getElementById('btnCam').onclick = startCam;
    document.getElementById('btnSnap').onclick = snap;
    document.getElementById('fileInput').onchange = onFile;
    document.getElementById('btnAnalyze').onclick = analyze;
    document.getElementById('btnSpeak').onclick = () => {
      if (lastDetections.length) speakEnglish(lastDetections[0].class);
    };

    loadModel();
    try {
      const g = localStorage.getItem('ai_grade') || '3';
      document.getElementById('backLink').href = 'lam-quen-voi-ai.html#lop' + g;
    } catch (e) {}
  </script>
</body>
</html>
