<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tìm cặp thông minh | Làm quen với AI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --blue:#0b5fff; --green:#00a86b; --purple:#7c3aed; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Be Vietnam Pro',system-ui,sans-serif; background:linear-gradient(160deg,#e0e7ff,#fce7f3,#ecfdf5); min-height:100vh; color:#0f172a; }
    .topbar { background:#fff; box-shadow:0 2px 12px rgba(0,0,0,.06); padding:12px 20px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:50; }
    .topbar a { color:var(--blue); font-weight:700; text-decoration:none; display:inline-flex; align-items:center; gap:6px; font-size:14px; }
    .topbar h1 { font-size:17px; font-weight:800; color:var(--purple); }
    .wrap { max-width:560px; margin:0 auto; padding:20px 16px 48px; }
    .hero { background:linear-gradient(135deg,#7c3aed,#0b5fff); color:#fff; border-radius:20px; padding:20px; text-align:center; margin-bottom:16px; }
    .card { background:#fff; border-radius:18px; box-shadow:0 4px 24px rgba(0,0,0,.08); padding:18px; }
    .info { display:flex; justify-content:space-between; font-weight:700; font-size:14px; margin-bottom:14px; }
    .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
    .card-cell {
      aspect-ratio:1; border-radius:12px; cursor:pointer; position:relative;
      transform-style:preserve-3d; transition:transform .35s;
    }
    .card-cell.flipped, .card-cell.matched { transform:rotateY(180deg); pointer-events:none; }
    .face {
      position:absolute; inset:0; border-radius:12px; display:grid; place-items:center;
      backface-visibility:hidden; font-size:28px; font-weight:800;
    }
    .face.back { background:linear-gradient(135deg,#7c3aed,#3b82f6); color:#fff; }
    .face.front { background:#f1f5f9; transform:rotateY(180deg); border:2px solid #e2e8f0; }
    .card-cell.matched .face.front { background:#ecfdf5; border-color:var(--green); }
    .btn { display:inline-flex; align-items:center; gap:8px; padding:12px 22px; border-radius:999px; font-weight:700; font-size:14px; border:0; cursor:pointer; background:var(--blue); color:#fff; margin-top:14px; font-family:inherit; }
    .msg { text-align:center; margin-top:12px; font-weight:700; color:var(--green); min-height:24px; }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="lam-quen-voi-ai.html" id="backLink"><i class="fas fa-arrow-left"></i> Làm quen với AI</a>
    <h1><i class="fas fa-clone"></i> Tìm cặp thông minh</h1>
    <span style="width:90px"></span>
  </div>
  <div class="wrap">
    <div class="hero">
      <h2>🧠 Tìm cặp giống nhau</h2>
      <p>Lật thẻ tìm cặp AI – luyện trí nhớ (phù hợp lớp 2).</p>
    </div>
    <div class="card">
      <div class="info">
        <span>Lượt: <strong id="moves">0</strong></span>
        <span>Cặp: <strong id="pairs">0</strong>/8</span>
      </div>
      <div class="grid" id="grid"></div>
      <div class="msg" id="msg"></div>
      <div style="text-align:center"><button class="btn" id="restart"><i class="fas fa-redo"></i> Chơi lại</button></div>
    </div>
  </div>
  <script>
    const icons = ['🤖','📷','🔊','🎨','📚','🔒','💡','🧠'];
    let cards = [], flipped = [], moves = 0, pairs = 0, lock = false;

    function init() {
      cards = [...icons, ...icons].sort(() => Math.random() - 0.5);
      flipped = []; moves = 0; pairs = 0; lock = false;
      document.getElementById('moves').textContent = '0';
      document.getElementById('pairs').textContent = '0';
      document.getElementById('msg').textContent = '';
      const grid = document.getElementById('grid');
      grid.innerHTML = cards.map((icon, i) =>
        `<div class="card-cell" data-i="${i}" data-icon="${icon}">
          <div class="face back">?</div>
          <div class="face front">${icon}</div>
        </div>`
      ).join('');
      grid.querySelectorAll('.card-cell').forEach(el => {
        el.onclick = () => flip(el);
      });
      try {
        const g = localStorage.getItem('ai_grade') || '2';
        document.getElementById('backLink').href = 'lam-quen-voi-ai.html#lop' + g;
      } catch(e){}
    }

    function flip(el) {
      if (lock || el.classList.contains('flipped') || el.classList.contains('matched')) return;
      el.classList.add('flipped');
      flipped.push(el);
      if (flipped.length === 2) {
        moves++;
        document.getElementById('moves').textContent = moves;
        lock = true;
        const [a, b] = flipped;
        if (a.dataset.icon === b.dataset.icon) {
          a.classList.add('matched');
          b.classList.add('matched');
          pairs++;
          document.getElementById('pairs').textContent = pairs;
          flipped = [];
          lock = false;
          if (pairs === 8) document.getElementById('msg').textContent = '🎉 Giỏi quá! Em tìm đủ tất cả các cặp!';
        } else {
          setTimeout(() => {
            a.classList.remove('flipped');
            b.classList.remove('flipped');
            flipped = [];
            lock = false;
          }, 700);
        }
      }
    }

    document.getElementById('restart').onclick = init;
    init();
  </script>
</body>
</html>
